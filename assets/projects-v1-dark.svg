<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 930" role="img" aria-labelledby="title desc"><title id="title">Selected Projects</title><desc id="desc">Two selected projects: Zero-Drift K8 Pipeline and AI Supply Chain.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101F"/><stop offset="1" stop-color="#0B1220"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#818CF8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter><style>.eyebrow{font:700 16px ui-monospace;letter-spacing:4px;fill:#94A3B8}.headline{font:800 52px ui-sans-serif;letter-spacing:-2.5px;fill:#F8FAFC}.lead{font:400 20px ui-sans-serif;fill:#94A3B8}.num{font:800 14px ui-monospace;letter-spacing:2px;fill:#94A3B8}.title{font:800 30px ui-sans-serif;letter-spacing:-1px;fill:#F8FAFC}.subtitle{font:650 18px ui-sans-serif;fill:#CBD5E1}.body{font:450 18px ui-sans-serif;fill:#CBD5E1}.tag{font:750 13px ui-monospace;fill:#CBD5E1}.meta{font:800 13px ui-monospace;letter-spacing:1.3px;fill:#60A5FA}.detail{font:500 16px ui-sans-serif;fill:#94A3B8}.card{transition:transform .28s ease}.card:hover{transform:translateY(-5px)}@keyframes breathe{0%,100%{opacity:.4}50%{opacity:.85}}.pulse{animation:breathe 3.5s ease-in-out infinite}</style></defs><rect width="1536" height="930" fill="url(#bg)"/><text x="768" y="56" text-anchor="middle" class="eyebrow">SELECTED PROJECTS</text><text x="768" y="116" text-anchor="middle" class="headline">Things I’ve been building.</text><text x="768" y="151" text-anchor="middle" class="lead">Projects that show how I approach infrastructure, automation, and real-world systems.</text><rect x="735" y="176" width="66" height="3" rx="1.5" fill="url(#accent)" class="pulse"/>
<g class="card" filter="url(#shadow)"><rect x="88" y="220" width="660" height="600" rx="22" fill="#0D1728" stroke="#243247"/><rect x="88" y="220" width="6" height="600" rx="3" fill="url(#accent)"/><circle cx="145" cy="279" r="31" fill="#10233F" stroke="#1D4ED8"/><g transform="translate(124 258)" fill="none" stroke="#60A5FA" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="14" height="14" rx="3"/><rect x="35" y="3" width="14" height="14" rx="3"/><rect x="19" y="35" width="14" height="14" rx="3"/><path d="M17 10h18M42 17v9c0 5-3 9-9 9"/></g><text x="198" y="264" class="num">PROJECT 01</text><text x="198" y="301" class="title">Zero-Drift K8 Pipeline</text><text x="198" y="332" class="subtitle">GitOps-driven Kubernetes delivery</text><text x="122" y="390" class="body">A delivery pipeline built around GitOps, infrastructure as</text><text x="122" y="418" class="body">code, and continuous reconciliation of the desired state.</text><text x="122" y="468" class="meta">TECHNOLOGIES</text><rect x="122" y="486" width="101" height="32" rx="16" fill="#172235"/><text x="172" y="507" text-anchor="middle" class="tag">GITHUB ACTIONS</text><rect x="231" y="486" width="68" height="32" rx="16" fill="#172235"/><text x="265" y="507" text-anchor="middle" class="tag">DOCKER</text><rect x="307" y="486" width="59" height="32" rx="16" fill="#172235"/><text x="336" y="507" text-anchor="middle" class="tag">HELM</text><rect x="374" y="486" width="67" height="32" rx="16" fill="#172235"/><text x="407" y="507" text-anchor="middle" class="tag">ARGO CD</text><rect x="449" y="486" width="92" height="32" rx="16" fill="#172235"/><text x="495" y="507" text-anchor="middle" class="tag">KUBERNETES</text><text x="122" y="570" class="meta">WHY IT MATTERS</text><text x="122" y="600" class="detail">GitOps · Kubernetes · IaC · CI/CD · Self-healing</text><line x1="122" y1="646" x2="714" y2="646" stroke="#243247"/><text x="122" y="686" class="detail">Terraform provisions the infrastructure, while Argo CD</text><text x="122" y="712" class="detail">continuously reconciles the desired state.</text><text x="122" y="770" class="meta">OPEN PROJECT  →</text></g>
<g class="card" filter="url(#shadow)"><rect x="788" y="220" width="660" height="600" rx="22" fill="#11162A" stroke="#2D3450"/><rect x="788" y="220" width="6" height="600" rx="3" fill="#818CF8"/><circle cx="845" cy="279" r="31" fill="#211D3D" stroke="#4F46E5"/><g transform="translate(824 258)" fill="none" stroke="#818CF8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="11" r="5"/><circle cx="40" cy="5" r="5"/><circle cx="42" cy="37" r="5"/><circle cx="12" cy="43" r="5"/><path d="M13 9L35 6M12 15v23M16 42l21-4M43 10l-1 22"/></g><text x="898" y="264" class="num">PROJECT 02</text><text x="898" y="301" class="title">AI Supply Chain</text><text x="898" y="332" class="subtitle">AI-assisted supply-chain platform</text><text x="822" y="390" class="body">A full-stack system connecting operational data, APIs,</text><text x="822" y="418" class="body">persistent ERP ingestion, and AI-assisted workflows.</text><text x="822" y="468" class="meta">TECHNOLOGIES</text><rect x="822" y="486" width="72" height="32" rx="16" fill="#1C2136"/><text x="858" y="507" text-anchor="middle" class="tag">NEXT.JS</text><rect x="902" y="486" width="75" height="32" rx="16" fill="#1C2136"/><text x="939" y="507" text-anchor="middle" class="tag">FASTAPI</text><rect x="985" y="486" width="94" height="32" rx="16" fill="#1C2136"/><text x="1032" y="507" text-anchor="middle" class="tag">POSTGRESQL</text><rect x="1087" y="486" width="57" height="32" rx="16" fill="#1C2136"/><text x="1115" y="507" text-anchor="middle" class="tag">REDIS</text><rect x="1152" y="486" width="75" height="32" rx="16" fill="#1C2136"/><text x="1190" y="507" text-anchor="middle" class="tag">AI WORKFLOWS</text><text x="822" y="570" class="meta">WHY IT MATTERS</text><text x="822" y="600" class="detail">AI · APIs · Data workflows · Full-stack systems</text><line x1="822" y1="646" x2="1414" y2="646" stroke="#2D3450"/><text x="822" y="686" class="detail">Persistent operational data with an application layer</text><text x="822" y="712" class="detail">designed around real supply-chain workflows.</text><text x="822" y="770" class="meta">OPEN PROJECT  →</text><rect x="1326" y="250" width="87" height="30" rx="15" fill="#0F2B25" stroke="#14532D"/><text x="1369" y="270" text-anchor="middle" class="tag" fill="#6EE7B7">ACTIVE</text></g></svg>