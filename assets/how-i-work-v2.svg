<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 520" role="img" aria-labelledby="title desc"><title id="title">How I Work</title><desc id="desc">A six-step engineering workflow from plan to improve, with each step anchored directly on the flow.</desc><defs><linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563EB"/><stop offset="1" stop-color="#6366F1"/></linearGradient><style>.ey{font:700 15px ui-monospace,monospace;letter-spacing:3.5px;fill:#64748B}.h{font:800 48px ui-sans-serif,system-ui;letter-spacing:-2px;fill:#111827}.lead{font:400 19px ui-sans-serif,system-ui;fill:#64748B}.step{font:800 19px ui-sans-serif,system-ui;fill:#111827}.micro{font:500 14px ui-sans-serif,system-ui;fill:#64748B}.num{font:800 14px ui-monospace,monospace;fill:#2563EB}@keyframes dash{to{stroke-dashoffset:-90}}.flowline{stroke-dasharray:10 12;animation:dash 5s linear infinite}</style></defs><rect width="1536" height="520" fill="#FFFFFF"/><text x="768" y="52" text-anchor="middle" class="ey">HOW I WORK</text><text x="768" y="108" text-anchor="middle" class="h">From idea to reliable system.</text><text x="768" y="143" text-anchor="middle" class="lead">A simple loop I follow when building and operating software.</text><path d="M145 270 C270 210 300 270 395 270 C490 270 520 245 645 245 C770 245 790 270 895 270 C1000 270 1020 305 1145 305 C1260 305 1280 270 1390 270" fill="none" stroke="#D8E1EE" stroke-width="3"/><path d="M145 270 C270 210 300 270 395 270 C490 270 520 245 645 245 C770 245 790 270 895 270 C1000 270 1020 305 1145 305 C1260 305 1280 270 1390 270" fill="none" stroke="url(#flow)" stroke-width="3" class="flowline"/>
<g><circle cx="145" cy="270" r="30" fill="#EFF6FF" stroke="#BFDBFE"/><text x="145" y="276" text-anchor="middle" class="num">01</text><text x="145" y="345" text-anchor="middle" class="step">Plan</text><text x="145" y="369" text-anchor="middle" class="micro">Define the problem</text></g><g><circle cx="395" cy="270" r="30" fill="#F5F3FF" stroke="#DDD6FE"/><text x="395" y="276" text-anchor="middle" class="num">02</text><text x="395" y="345" text-anchor="middle" class="step">Build</text><text x="395" y="369" text-anchor="middle" class="micro">Create the solution</text></g><g><circle cx="645" cy="245" r="30" fill="#EFF6FF" stroke="#BFDBFE"/><text x="645" y="251" text-anchor="middle" class="num">03</text><text x="645" y="320" text-anchor="middle" class="step">Test</text><text x="645" y="344" text-anchor="middle" class="micro">Verify the behavior</text></g><g><circle cx="895" cy="270" r="30" fill="#F5F3FF" stroke="#DDD6FE"/><text x="895" y="276" text-anchor="middle" class="num">04</text><text x="895" y="345" text-anchor="middle" class="step">Deploy</text><text x="895" y="369" text-anchor="middle" class="micro">Ship with confidence</text></g><g><circle cx="1145" cy="305" r="30" fill="#EFF6FF" stroke="#BFDBFE"/><text x="1145" y="311" text-anchor="middle" class="num">05</text><text x="1145" y="380" text-anchor="middle" class="step">Observe</text><text x="1145" y="404" text-anchor="middle" class="micro">Watch what happens</text></g><g><circle cx="1390" cy="270" r="30" fill="#F5F3FF" stroke="#DDD6FE"/><text x="1390" y="276" text-anchor="middle" class="num">06</text><text x="1390" y="345" text-anchor="middle" class="step">Improve</text><text x="1390" y="369" text-anchor="middle" class="micro">Learn and iterate</text></g><text x="768" y="455" text-anchor="middle" class="micro">The loop repeats. Every release is another chance to make the system simpler, safer, and easier to operate.</text></svg>