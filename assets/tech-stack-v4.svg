<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 820" role="img" aria-labelledby="title desc"><title id="title">Technology Stack</title><desc id="desc">Scattered technology logos used by Vanshaj.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f7f9fc"/></linearGradient><style>.ey{font:700 15px ui-monospace,monospace;letter-spacing:3.5px;fill:#64748b}.h{font:800 48px ui-sans-serif,system-ui;letter-spacing:-2px;fill:#111827}@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.i{animation:drift 4s ease-in-out infinite}.i2{animation:drift 4.7s ease-in-out infinite}.i3{animation:drift 5.3s ease-in-out infinite}</style></defs><rect width="1536" height="820" fill="url(#bg)"/><text x="768" y="55" text-anchor="middle" class="ey">TECHNOLOGY STACK</text><text x="768" y="112" text-anchor="middle" class="h">The tools I work with.</text><g class="i"><image x="350" y="365" width="58" height="58" href="https://cdn.jsdelivr.net/npm/simple-icons@16/icons/amazonaws.svg"/></g><g class="i2"><image x="425" y="265" width="58" height="58" href="https://cdn.jsdelivr.net/npm/simple-icons@16/icons/microsoftazure.svg"/></g><g class="i3"><image x="530" y="205" width="56" height="56" href="https://cdn.jsdelivr.net/npm/simple-icons@16/icons/terraform.svg"/></g><g class="i"><image x="690" y="170" width="58" height="58" href="https://cdn.jsdelivr.net/npm/simple-icons@16/icons/docker.svg"/></g><g class="i2"><image x="820" y="185" width="58" height="58" href="https://cdn.jsdelivr.net/npm/simple-icons@16/icons/kubernetes.svg"/></g><g class="i"><image x="1095" y="345" width="58" height="58" href="https://cdn.jsdelivr.net/npm/simple-icons@16/icons/githubactions.svg"/></g><g class="i"><image x="900" y="650" width="58" height="58" href="https://cdn.jsdelivr.net/npm/simple-icons@16/icons/prometheus.svg"/></g><g class="i3"><image x="625" y="650" width="58" height="58" href="https://cdn.jsdelivr.net/npm/simple-icons@16/icons/newrelic.svg"/></g><g class="i2"><image x="815" y="345" width="60" height="60" href="https://cdn.jsdelivr.net/npm/simple-icons@16/icons/powershell.svg"/></g><g class="i3"><image x="900" y="420" width="60" height="60" href="https://cdn.jsdelivr.net/npm/simple-icons@16/icons/git.svg"/></g></svg>