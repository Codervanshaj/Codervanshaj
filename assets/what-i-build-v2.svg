<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc"><title id="title">What I Build</title><desc id="desc">Cloud infrastructure, delivery automation, reliability and observability, and engineering.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6F8FC"/></linearGradient><linearGradient id="grad" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563EB"/><stop offset="0.5" stop-color="#6366F1"/><stop offset="1" stop-color="#A855F7"/></linearGradient><radialGradient id="halo"><stop stop-color="#6366F1" stop-opacity="0.09"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="42"/></filter><filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.label{font:700 18px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:5px;fill:#64748B}.headline{font:800 76px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-4px;fill:#111827}.lead{font:450 24px ui-sans-serif,system-ui,sans-serif;fill:#64748B}.num{font:850 70px ui-sans-serif,system-ui,sans-serif;letter-spacing:-4px;fill:url(#grad)}.title{font:800 34px ui-sans-serif,system-ui,sans-serif;letter-spacing:-1.4px;fill:#111827}.body{font:450 20px ui-sans-serif,system-ui,sans-serif;fill:#64748B}.stack{font:750 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.5px;fill:#4F6FD8}</style></defs><rect width="1536" height="1024" fill="url(#bg)"/><circle cx="775" cy="50" r="430" fill="url(#halo)" filter="url(#blur)"/><circle cx="1260" cy="300" r="190" fill="#2563EB" opacity="0.04" filter="url(#blur)"/><text x="768" y="52" text-anchor="middle" class="label">WHAT I BUILD</text><text x="768" y="122" text-anchor="middle" class="headline">Systems that move</text><text x="768" y="194" text-anchor="middle" class="headline">from <tspan fill="url(#grad)">code to production.</tspan></text><text x="768" y="244" text-anchor="middle" class="lead">End-to-end systems built with infrastructure as code,</text><text x="768" y="278" text-anchor="middle" class="lead">automation at every step, and reliability by design.</text><g><text x="155" y="401" class="num">01</text><line x1="290" y1="322" x2="290" y2="438" stroke="url(#grad)" stroke-width="2" opacity="0.7"/><text x="342" y="370" class="title">Cloud Infrastructure</text><text x="342" y="405" class="body">Designing and automating scalable, secure, and cost-effective</text><text x="342" y="434" class="body">cloud foundations that are built to evolve with your needs.</text><text x="342" y="469" class="stack">AWS   ·   AZURE   ·   TERRAFORM   ·   BICEP   ·   ARM</text><g transform="translate(1180 338)" fill="none" stroke="url(#grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"><path d="M48 98C17 98 9 73 21 55C28 43 40 38 55 40C61 21 80 10 98 16C115 20 125 34 125 52C147 52 162 67 162 86C162 105 147 120 127 120H48C28 120 15 112 15 98Z"/><rect x="51" y="85" width="72" height="22" rx="6"/><rect x="51" y="109" width="72" height="22" rx="6"/><circle cx="108" cy="96" r="3.5" fill="#6366F1" stroke="none"/><circle cx="108" cy="120" r="3.5" fill="#A855F7" stroke="none"/></g><rect x="1170" y="464" width="165" height="3" rx="1.5" fill="url(#grad)" opacity="0.65"/></g><line x1="138" y1="486" x2="1398" y2="486" stroke="#E2E8F0" stroke-width="1"/><g><text x="155" y="545" class="num">02</text><line x1="290" y1="506" x2="290" y2="622" stroke="url(#grad)" stroke-width="2" opacity="0.7"/><text x="342" y="514" class="title">Delivery Automation</text><text x="342" y="549" class="body">Automating the path from code to production with reliable</text><text x="342" y="578" class="body">pipelines, quality gates, and consistent deployments.</text><text x="342" y="613" class="stack">GITHUB ACTIONS   ·   JENKINS   ·   HELM   ·   ARGO CD</text><g transform="translate(1180 493)" fill="none" stroke="url(#grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"><path d="M12 72C32 32 55 32 75 72C95 112 118 112 138 72C118 32 95 32 75 72C55 112 32 112 12 72Z"/><path d="M112 88L99 75M99 75H115M99 75V91"/></g><rect x="1170" y="608" width="165" height="3" rx="1.5" fill="url(#grad)" opacity="0.65"/></g><line x1="138" y1="626" x2="1398" y2="626" stroke="#E2E8F0" stroke-width="1"/><g><text x="155" y="686" class="num">03</text><line x1="290" y1="646" x2="290" y2="762" stroke="url(#grad)" stroke-width="2" opacity="0.7"/><text x="342" y="654" class="title">Reliability &amp; Observability</text><text x="342" y="689" class="body">Building visibility into systems with metrics, logs, and intelligent alerts</text><text x="342" y="718" class="body">so issues are detected before users feel them.</text><text x="342" y="753" class="stack">PROMETHEUS   ·   GRAFANA   ·   CLOUDWATCH   ·   ALERTING</text><g transform="translate(1178 646)" fill="none" stroke="url(#grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"><rect x="4" y="4" width="148" height="94" rx="8"/><path d="M27 62H49L61 39L73 73L90 48L106 60L120 46L136 62"/><path d="M78 98V114M59 114H97"/></g><rect x="1170" y="748" width="165" height="3" rx="1.5" fill="url(#grad)" opacity="0.65"/></g><line x1="138" y1="766" x2="1398" y2="766" stroke="#E2E8F0" stroke-width="1"/><g><text x="155" y="826" class="num">04</text><line x1="290" y1="786" x2="290" y2="902" stroke="url(#grad)" stroke-width="2" opacity="0.7"/><text x="342" y="794" class="title">Engineering</text><text x="342" y="829" class="body">Writing clean, maintainable code and automation that connects infrastructure,</text><text x="342" y="858" class="body">tools, and applications to solve real problems.</text><text x="342" y="893" class="stack">PYTHON   ·   POWERSHELL   ·   TYPESCRIPT   ·   NODE.JS</text><g transform="translate(1178 784)" fill="none" stroke="url(#grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"><rect x="4" y="4" width="148" height="94" rx="8"/><circle cx="23" cy="22" r="3.5" fill="#2563EB" stroke="none"/><circle cx="37" cy="22" r="3.5" fill="#6366F1" stroke="none"/><circle cx="51" cy="22" r="3.5" fill="#A855F7" stroke="none"/><path d="M51 50L35 64L51 78M106 50L122 64L106 78M84 45L70 83"/></g><rect x="1170" y="886" width="165" height="3" rx="1.5" fill="url(#grad)" opacity="0.65"/></g></svg>