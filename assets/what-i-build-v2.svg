<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 900" role="img" aria-labelledby="title desc">
<title id="title">What I Build</title>
<desc id="desc">Cloud infrastructure, delivery automation, reliability and observability, and engineering.</desc>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563EB"/><stop offset="1" stop-color="#4F46E5"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.07"/></filter>
  <style>
    .eyebrow{font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:4px;fill:#64748B}
    .headline{font:800 62px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-3px;fill:#0F172A}
    .lead{font:400 22px ui-sans-serif,system-ui,sans-serif;fill:#64748B}
    .num{font:750 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;fill:#2563EB}
    .title{font:750 25px ui-sans-serif,system-ui,sans-serif;letter-spacing:-.7px;fill:#0F172A}
    .body{font:400 17px ui-sans-serif,system-ui,sans-serif;fill:#64748B}
    .stack{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:#475569}
    .icon{fill:none;stroke:url(#accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
    .dot{fill:#2563EB}
  </style>
</defs>
<rect width="1536" height="900" rx="18" fill="#FFFFFF"/>
<path d="M120 104H1416" stroke="#E2E8F0"/>
<text x="120" y="67" class="eyebrow">WHAT I BUILD</text>
<text x="120" y="151" class="headline">Systems built to run.</text>
<text x="120" y="191" class="lead">From cloud foundations to production delivery, with automation and reliability built in.</text>
<rect x="120" y="220" width="76" height="4" rx="2" fill="url(#accent)"/>

<!-- Card 01 -->
<g filter="url(#shadow)">
  <rect x="120" y="270" width="628" height="250" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="120" y="270" width="5" height="250" rx="2.5" fill="#2563EB"/>
  <text x="154" y="306" class="num">01 / INFRASTRUCTURE</text>
  <text x="154" y="350" class="title">Cloud Infrastructure</text>
  <text x="154" y="385" class="body">Scalable, secure cloud foundations designed</text>
  <text x="154" y="410" class="body">to evolve without becoming a maintenance burden.</text>
  <text x="154" y="456" class="stack">AWS · AZURE · TERRAFORM · BICEP · ARM</text>
  <g transform="translate(644 324)" class="icon">
    <path d="M-8 48C-28 48-35 32-27 19C-22 11-14 8-5 9C-1-4 12-11 24-7C36-4 43 6 43 18C58 18 68 28 68 41C68 54 58 64 45 64H-8C-22 64-30 58-30 48Z"/>
    <rect x="0" y="31" width="39" height="12" rx="3"/><rect x="0" y="45" width="39" height="12" rx="3"/>
    <circle cx="30" cy="37" r="2.2" class="dot" stroke="none"/><circle cx="30" cy="51" r="2.2" class="dot" stroke="none"/>
  </g>
</g>

<!-- Card 02 -->
<g filter="url(#shadow)">
  <rect x="788" y="270" width="628" height="250" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="788" y="270" width="5" height="250" rx="2.5" fill="#4F46E5"/>
  <text x="822" y="306" class="num">02 / DELIVERY</text>
  <text x="822" y="350" class="title">Delivery Automation</text>
  <text x="822" y="385" class="body">Reliable paths from code to production through</text>
  <text x="822" y="410" class="body">repeatable pipelines, checks, and deployments.</text>
  <text x="822" y="456" class="stack">GITHUB ACTIONS · JENKINS · HELM · ARGO CD</text>
  <g transform="translate(1308 333)" class="icon">
    <circle cx="0" cy="0" r="10"/><circle cx="82" cy="0" r="10"/><circle cx="41" cy="58" r="10"/>
    <path d="M10 0H72M8 7L33 50M74 7L49 50"/>
    <path d="M38 58H22"/><path d="M22 58L28 52"/><path d="M22 58L28 64"/>
  </g>
</g>

<!-- Card 03 -->
<g filter="url(#shadow)">
  <rect x="120" y="550" width="628" height="250" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="120" y="550" width="5" height="250" rx="2.5" fill="#0EA5E9"/>
  <text x="154" y="586" class="num">03 / RELIABILITY</text>
  <text x="154" y="630" class="title">Reliability &amp; Observability</text>
  <text x="154" y="665" class="body">Metrics, logs, and alerts that make system health</text>
  <text x="154" y="690" class="body">visible before an issue reaches the user.</text>
  <text x="154" y="736" class="stack">PROMETHEUS · GRAFANA · CLOUDWATCH · ALERTING</text>
  <g transform="translate(638 608)" class="icon">
    <rect x="0" y="0" width="104" height="68" rx="7"/>
    <path d="M14 45H30L39 27L49 51L62 34L75 42L88 28L96 36"/>
    <path d="M52 68V82M37 82H67"/>
  </g>
</g>

<!-- Card 04 -->
<g filter="url(#shadow)">
  <rect x="788" y="550" width="628" height="250" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="788" y="550" width="5" height="250" rx="2.5" fill="#6366F1"/>
  <text x="822" y="586" class="num">04 / ENGINEERING</text>
  <text x="822" y="630" class="title">Engineering</text>
  <text x="822" y="665" class="body">Clean code and automation connecting infrastructure,</text>
  <text x="822" y="690" class="body">tools, and applications to solve practical problems.</text>
  <text x="822" y="736" class="stack">PYTHON · POWERSHELL · TYPESCRIPT · NODE.JS</text>
  <g transform="translate(1300 604)" class="icon">
    <path d="M28 16L0 40L28 64M76 16L104 40L76 64"/>
    <path d="M62 8L42 72"/>
    <circle cx="0" cy="40" r="3" class="dot" stroke="none"/><circle cx="104" cy="40" r="3" class="dot" stroke="none"/>
  </g>
</g>

<!-- restrained micro-motion: a breathing accent, no distracting movement -->
<circle cx="204" cy="222" r="3" fill="#2563EB">
  <animate attributeName="opacity" values="0.35;0.9;0.35" dur="3.2s" repeatCount="indefinite"/>
</circle>
</svg>