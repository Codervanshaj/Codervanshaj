<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 980" role="img" aria-labelledby="title desc"><title id="title">Technology Stack</title><desc id="desc">Technology stack grouped into four practical engineering areas.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101F"/><stop offset="1" stop-color="#0B1220"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#818CF8"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".28"/></filter><style>.ey{font:700 15px ui-monospace;letter-spacing:3.5px;fill:#94A3B8}.h{font:800 48px ui-sans-serif;letter-spacing:-2.2px;fill:#F8FAFC}.intro{font:400 19px ui-sans-serif;fill:#94A3B8}.ct{font:800 23px ui-sans-serif;fill:#F8FAFC;letter-spacing:-.5px}.cs{font:500 15px ui-sans-serif;fill:#94A3B8}.name{font:700 15px ui-sans-serif;fill:#CBD5E1}.note{font:500 14px ui-sans-serif;fill:#94A3B8}.card{transition:transform .25s ease}.card:hover{transform:translateY(-5px)}@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}.pulse{animation:breathe 3.2s ease-in-out infinite}</style></defs><rect width="1536" height="980" fill="url(#bg)"/><text x="768" y="54" text-anchor="middle" class="ey">TECHNOLOGY STACK</text><text x="768" y="112" text-anchor="middle" class="h">The tools behind the work.</text><text x="768" y="146" text-anchor="middle" class="intro">A practical stack organized by where each tool fits in the systems I build.</text><rect x="730" y="171" width="76" height="4" rx="2" fill="url(#line)" class="pulse"/>
<g class="card" filter="url(#shadow)"><rect x="70" y="210" width="680" height="335" rx="26" fill="#0D1728" stroke="#243247"/><rect x="70" y="210" width="7" height="335" rx="3.5" fill="#60A5FA"/><circle cx="121" cy="264" r="25" fill="#10233F"/><g transform="translate(105 248)" fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 25h20M10 25a8 8 0 1 1 14-5 6 6 0 0 1 4 11H8a5 5 0 0 1 0-10Z"/></g><text x="163" y="259" class="ct">Cloud &amp; Infrastructure</text><text x="163" y="283" class="cs">Provision, package, and run infrastructure.</text><g><rect x="105" y="320" width="120" height="70" rx="16" fill="#172235" stroke="#2D3A50"/><image href="https://cdn.simpleicons.org/amazonaws/FF9900" x="136" y="330" width="30" height="30"/><text x="165" y="377" text-anchor="middle" class="name">AWS</text><rect x="237" y="320" width="120" height="70" rx="16" fill="#172235" stroke="#2D3A50"/><image href="https://raw.githubusercontent.com/Codervanshaj/Codervanshaj/main/assets/icons/azure.svg" x="268" y="330" width="30" height="30"/><text x="297" y="377" text-anchor="middle" class="name">Azure</text><rect x="369" y="320" width="120" height="70" rx="16" fill="#172235" stroke="#2D3A50"/><image href="https://cdn.simpleicons.org/terraform/844FBA" x="404" y="330" width="30" height="30"/><text x="429" y="377" text-anchor="middle" class="name">Terraform</text><rect x="501" y="320" width="120" height="70" rx="16" fill="#172235" stroke="#2D3A50"/><image href="https://cdn.simpleicons.org/docker/2496ED" x="546" y="330" width="30" height="30"/><text x="561" y="377" text-anchor="middle" class="name">Docker</text><rect x="633" y="320" width="82" height="70" rx="16" fill="#172235" stroke="#2D3A50"/><image href="https://cdn.simpleicons.org/kubernetes/326CE5" x="659" y="330" width="30" height="30"/><text x="674" y="377" text-anchor="middle" class="name">K8s</text></g><text x="105" y="439" class="note">AWS · Azure · Terraform · Docker · Kubernetes</text><text x="105" y="468" class="note">Infrastructure as code with repeatable environments.</text></g>
