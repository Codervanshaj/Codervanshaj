<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Developer Quote</title>
<desc id="desc">The function of good software is to make the complex appear to be simple. — Grady Booch</desc>
<rect width="1200" height="330" fill="#0d1117"/>
<text x="42" y="48" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" letter-spacing="3" fill="#8b949e">DEVELOPER QUOTE</text>
<line x1="42" y1="70" x2="1158" y2="70" stroke="#30363d" stroke-width="2"/>
<rect x="108" y="102" width="984" height="178" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="140" y="160" font-family="Georgia,'Times New Roman',serif" font-size="30" font-style="italic" fill="#58a6ff">“</text>
<text x="168" y="163" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="27" font-style="italic" font-weight="500" fill="#e6edf3">The function of good software is to make the complex</text>
<text x="168" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="27" font-style="italic" font-weight="500" fill="#e6edf3">appear to be simple.</text>
<text x="1050" y="251" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" fill="#58a6ff">GRADY BOOCH</text>
</svg>