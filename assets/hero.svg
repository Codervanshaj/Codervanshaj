<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Vanshaj Agarwal · DevOps and Cloud Engineer</title>
<desc id="desc">A glass-style engineering pipeline connecting infrastructure, delivery, runtime, and observability.</desc>
<defs>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FCFDFE"/><stop offset="1" stop-color="#F4F7FA"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563EB"/><stop offset="0.55" stop-color="#0891B2"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.70"/><stop offset="0.48" stop-color="#F8FAFC" stop-opacity="0.48"/><stop offset="1" stop-color="#EEF2F7" stop-opacity="0.62"/></linearGradient>
<filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.07"/></filter>
<marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#0891B2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="2" y="2" width="1196" height="426" rx="28" fill="url(#surface)" stroke="#E2E8F0" stroke-width="2"/>
<rect x="62" y="58" width="38" height="4" rx="2" fill="url(#accent)"/>
<text x="62" y="88" font-family="system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="2.6" fill="#64748B">DEVOPS · CLOUD · AUTOMATION</text>
<text x="62" y="166" font-family="system-ui,sans-serif" font-size="66" font-weight="800" letter-spacing="-3.5" fill="#111827">Vanshaj Agarwal</text>
<text x="64" y="207" font-family="system-ui,sans-serif" font-size="22" font-weight="650" fill="#334155">DevOps &amp; Cloud Engineer</text>
<text x="64" y="238" font-family="system-ui,sans-serif" font-size="15" fill="#64748B">I build infrastructure, delivery pipelines, and automation that move systems reliably from code to production.</text>
<g transform="translate(105 304)">
<!-- Pipeline 1: long enough to read as a real connector, with a quiet base and animated dash flow. -->
<g><line x1="145" y1="36" x2="225" y2="36" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/><line x1="145" y1="36" x2="225" y2="36" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10 9" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" from="0" to="-38" dur="1.5s" repeatCount="indefinite"/></line></g>
<!-- Pipeline 2 -->
<g><line x1="370" y1="36" x2="450" y2="36" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/><line x1="370" y1="36" x2="450" y2="36" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10 9" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" from="0" to="-38" dur="1.5s" begin=".45s" repeatCount="indefinite"/></line></g>
<!-- Pipeline 3 -->
<g><line x1="595" y1="36" x2="675" y2="36" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/><line x1="595" y1="36" x2="675" y2="36" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10 9" marker-end="url(#arrow)"><animate attributeName="stroke-dashoffset" from="0" to="-38" dur="1.5s" begin=".9s" repeatCount="indefinite"/></line></g>
<!-- Fixed glass cards. Their geometry is never animated. -->
<g filter="url(#shadow)"><rect width="145" height="72" rx="18" fill="url(#glass)" stroke="#CBD5E1" stroke-opacity="0.72"/><path d="M18 1 H127" stroke="#FFFFFF" stroke-opacity="0.82" stroke-width="1.5" stroke-linecap="round"/><circle cx="24" cy="24" r="6" fill="#2563EB"/><text x="39" y="28" font-family="system-ui,sans-serif" font-size="11.5" font-weight="750" fill="#1E293B">INFRASTRUCTURE</text><text x="39" y="48" font-family="system-ui,sans-serif" font-size="10" fill="#64748B">Terraform · Cloud</text></g>
<g transform="translate(225 0)" filter="url(#shadow)"><rect width="145" height="72" rx="18" fill="url(#glass)" stroke="#CBD5E1" stroke-opacity="0.72"/><path d="M18 1 H127" stroke="#FFFFFF" stroke-opacity="0.82" stroke-width="1.5" stroke-linecap="round"/><circle cx="24" cy="24" r="6" fill="#0891B2"/><text x="39" y="28" font-family="system-ui,sans-serif" font-size="11.5" font-weight="750" fill="#1E293B">DELIVERY</text><text x="39" y="48" font-family="system-ui,sans-serif" font-size="10" fill="#64748B">CI/CD · GitOps</text></g>
<g transform="translate(450 0)" filter="url(#shadow)"><rect width="145" height="72" rx="18" fill="url(#glass)" stroke="#CBD5E1" stroke-opacity="0.72"/><path d="M18 1 H127" stroke="#FFFFFF" stroke-opacity="0.82" stroke-width="1.5" stroke-linecap="round"/><circle cx="24" cy="24" r="6" fill="#7C3AED"/><text x="39" y="28" font-family="system-ui,sans-serif" font-size="11.5" font-weight="750" fill="#1E293B">RUNTIME</text><text x="39" y="48" font-family="system-ui,sans-serif" font-size="10" fill="#64748B">Docker · Kubernetes</text></g>
<g transform="translate(675 0)" filter="url(#shadow)"><rect width="145" height="72" rx="18" fill="url(#glass)" stroke="#CBD5E1" stroke-opacity="0.72"/><path d="M18 1 H127" stroke="#FFFFFF" stroke-opacity="0.82" stroke-width="1.5" stroke-linecap="round"/><circle cx="24" cy="24" r="6" fill="#16A34A"/><text x="39" y="28" font-family="system-ui,sans-serif" font-size="11.5" font-weight="750" fill="#1E293B">OBSERVE</text><text x="39" y="48" font-family="system-ui,sans-serif" font-size="10" fill="#64748B">Prometheus · Metrics</text></g>
</g>
<text x="64" y="408" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2.6" fill="#64748B">BUILD · DEPLOY · OBSERVE · IMPROVE</text><text x="1136" y="408" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2.6" fill="#64748B">01 / 01</text>
</svg>