<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Vanshaj Agarwal · DevOps · Cloud · Automation</title>
  <desc id="desc">A polished dark engineering control-plane hero with real technology icons and an animated delivery signal connecting cloud, infrastructure, delivery and observability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.52" stop-color="#0C1322"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.38" stop-color="#60A5FA"/>
      <stop offset="0.72" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2563EB" stop-opacity=".16"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#CBD5E1" stroke-opacity=".035"/>
    </pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .eyebrow{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:2.6px;fill:#64748B}
      .name{font:800 58px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-2.8px;fill:#F8FAFC}
      .role{font:500 20px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#CBD5E1}
      .nodeTitle{font:700 15px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#F8FAFC}
      .nodeSub{font:500 11px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94A3B8}
      .nodeLabel{font:600 10px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:1.8px;fill:#64748B}
      .flow{stroke-dasharray:9 14;animation:flow 4s linear infinite}
      .pulse{animation:pulse 2.2s ease-in-out infinite}
      .orbit{transform-origin:948px 248px;animation:spin 18s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-92}}
      @keyframes pulse{0%,100%{opacity:.35;transform:scale(.82)}50%{opacity:1;transform:scale(1.12)}}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </defs>

  <rect x="2" y="2" width="1196" height="516" rx="30" fill="url(#bg)" stroke="#1E293B" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="516" rx="30" fill="url(#grid)"/>
  <circle cx="950" cy="245" r="245" fill="url(#halo)"/>

  <!-- Header -->
  <text x="68" y="62" class="eyebrow">VANSHAJ AGARWAL / ENGINEERING PROFILE</text>
  <circle cx="1110" cy="56" r="5" fill="#22C55E" class="pulse"/>
  <text x="1128" y="61" class="nodeLabel">OPEN TO BUILD</text>

  <text x="68" y="136" class="name">Vanshaj Agarwal</text>
  <text x="70" y="174" class="role">DevOps · Cloud · Automation</text>
  <text x="70" y="202" class="nodeSub sans" font-size="13">Infrastructure as code · CI/CD · Kubernetes · Observability</text>

  <!-- Focus panel -->
  <g transform="translate(68 232)">
    <rect width="350" height="108" rx="18" fill="#0B1220" stroke="#24324A"/>
    <rect x="0" y="0" width="4" height="108" rx="2" fill="#38BDF8"/>
    <text x="24" y="29" class="nodeLabel">CURRENT FOCUS</text>
    <text x="24" y="58" class="nodeTitle">Reliable delivery systems</text>
    <text x="24" y="79" class="nodeSub">From infrastructure to production</text>
    <g transform="translate(24 88)">
      <circle cx="4" cy="4" r="4" fill="#22C55E"/>
      <text x="16" y="8" class="nodeLabel">AUTOMATION ONLINE</text>
    </g>
  </g>

  <!-- Real technology icon rail -->
  <g transform="translate(68 372)">
    <text x="0" y="0" class="nodeLabel">CORE TOOLCHAIN</text>
    <g transform="translate(0 18)">
      <rect width="62" height="62" rx="16" fill="#0B1220" stroke="#24324A"/>
      <image x="14" y="14" width="34" height="34" href="https://cdn.simpleicons.org/amazonwebservices/FF9900"/>
    </g>
    <g transform="translate(76 18)">
      <rect width="62" height="62" rx="16" fill="#0B1220" stroke="#24324A"/>
      <image x="14" y="14" width="34" height="34" href="https://cdn.simpleicons.org/terraform/844FBA"/>
    </g>
    <g transform="translate(152 18)">
      <rect width="62" height="62" rx="16" fill="#0B1220" stroke="#24324A"/>
      <image x="14" y="14" width="34" height="34" href="https://cdn.simpleicons.org/kubernetes/326CE5"/>
    </g>
    <g transform="translate(228 18)">
      <rect width="62" height="62" rx="16" fill="#0B1220" stroke="#24324A"/>
      <image x="14" y="14" width="34" height="34" href="https://cdn.simpleicons.org/githubactions/2088FF"/>
    </g>
    <g transform="translate(304 18)">
      <rect width="62" height="62" rx="16" fill="#0B1220" stroke="#24324A"/>
      <image x="14" y="14" width="34" height="34" href="https://cdn.simpleicons.org/argocd/EF7B4D"/>
    </g>
  </g>

  <!-- Delivery control plane -->
  <g transform="translate(492 214)">
    <text x="0" y="0" class="nodeLabel">DELIVERY CONTROL PLANE</text>
    <path d="M0 52H638" stroke="#1E293B" stroke-width="2"/>
    <path d="M0 52H638" stroke="url(#signal)" stroke-width="3" class="flow" filter="url(#glow)"/>

    <!-- cloud -->
    <g transform="translate(0 20)">
      <rect width="142" height="132" rx="20" fill="#0B1220" stroke="#27364F"/>
      <image x="47" y="20" width="48" height="48" href="https://cdn.simpleicons.org/amazonwebservices/FF9900"/>
      <text x="71" y="91" text-anchor="middle" class="nodeTitle">CLOUD</text>
      <text x="71" y="111" text-anchor="middle" class="nodeSub">AWS · Azure</text>
      <circle cx="118" cy="20" r="4" fill="#38BDF8" class="pulse"/>
    </g>

    <!-- infra -->
    <g transform="translate(166 20)">
      <rect width="142" height="132" rx="20" fill="#0B1220" stroke="#27364F"/>
      <image x="47" y="20" width="48" height="48" href="https://cdn.simpleicons.org/terraform/844FBA"/>
      <text x="71" y="91" text-anchor="middle" class="nodeTitle">INFRA</text>
      <text x="71" y="111" text-anchor="middle" class="nodeSub">Terraform · Bicep</text>
      <circle cx="118" cy="20" r="4" fill="#A78BFA" class="pulse"/>
    </g>

    <!-- delivery -->
    <g transform="translate(332 20)">
      <rect width="142" height="132" rx="20" fill="#0B1220" stroke="#27364F"/>
      <image x="47" y="20" width="48" height="48" href="https://cdn.simpleicons.org/kubernetes/326CE5"/>
      <text x="71" y="91" text-anchor="middle" class="nodeTitle">DELIVERY</text>
      <text x="71" y="111" text-anchor="middle" class="nodeSub">K8s · GitOps</text>
      <circle cx="118" cy="20" r="4" fill="#60A5FA" class="pulse"/>
    </g>

    <!-- observe -->
    <g transform="translate(498 20)">
      <rect width="142" height="132" rx="20" fill="#0B1220" stroke="#27364F"/>
      <image x="47" y="20" width="48" height="48" href="https://cdn.simpleicons.org/grafana/F46800"/>
      <text x="71" y="91" text-anchor="middle" class="nodeTitle">OBSERVE</text>
      <text x="71" y="111" text-anchor="middle" class="nodeSub">Prometheus · Grafana</text>
      <circle cx="118" cy="20" r="4" fill="#F59E0B" class="pulse"/>
    </g>

    <!-- moving deployment packet -->
    <circle r="6" fill="#F8FAFC" filter="url(#glow)">
      <animateMotion dur="4.4s" repeatCount="indefinite" path="M0 52 H638"/>
    </circle>

    <!-- orbit -->
    <g class="orbit">
      <circle cx="638" cy="52" r="88" fill="none" stroke="#64748B" stroke-opacity=".16" stroke-dasharray="2 13"/>
      <circle cx="726" cy="52" r="4" fill="#A78BFA" filter="url(#glow)"/>
    </g>
  </g>

  <text x="1132" y="485" text-anchor="end" class="eyebrow">PLAN → BUILD → DEPLOY → OBSERVE</text>
</svg>
