<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Vanshaj Agarwal · DevOps and Cloud Engineer</title>
  <desc id="desc">A minimal editorial hero with a calm engineering flow from infrastructure to delivery and observability.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFCFE"/>
      <stop offset="1" stop-color="#F3F6FA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.55" stop-color="#0891B2"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .kicker{font:700 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:2.8px;fill:#64748B}
      .name{font:800 66px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-3.5px;fill:#111827}
      .role{font:650 22px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
      .body{font:450 15px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748B}
      .node{font:750 12px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1E293B}
      .nodeSmall{font:500 10px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748B}
      .flow{stroke-dasharray:8 13;animation:flow 4.8s linear infinite}
      .pulse{animation:pulse 2.6s ease-in-out infinite}
      .packet{animation:packet 4.8s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-105}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes packet{0%{transform:translateX(0)}100%{transform:translateX(744px)}}
    </style>
  </defs>

  <rect x="2" y="2" width="1196" height="426" rx="28" fill="url(#surface)" stroke="#E2E8F0" stroke-width="2"/>

  <!-- restrained accent -->
  <rect x="62" y="58" width="38" height="4" rx="2" fill="url(#accent)"/>
  <text x="62" y="88" class="kicker">DEVOPS · CLOUD · AUTOMATION</text>

  <!-- identity -->
  <text x="62" y="166" class="name">Vanshaj Agarwal</text>
  <text x="64" y="207" class="role">DevOps &amp; Cloud Engineer</text>
  <text x="64" y="238" class="body">I build infrastructure, delivery pipelines, and automation that move systems reliably from code to production.</text>

  <!-- single visual story -->
  <g transform="translate(64 304)">
    <path d="M28 36 H772" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M28 36 H772" stroke="url(#accent)" stroke-width="2.5" class="flow" filter="url(#glow)"/>

    <!-- nodes -->
    <g transform="translate(0 0)" filter="url(#softShadow)">
      <rect width="152" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="25" cy="24" r="7" fill="#2563EB" class="pulse"/>
      <text x="44" y="28" class="node">INFRASTRUCTURE</text>
      <text x="44" y="48" class="nodeSmall">Terraform · Cloud</text>
    </g>

    <g transform="translate(198 0)" filter="url(#softShadow)">
      <rect width="152" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="25" cy="24" r="7" fill="#0891B2" class="pulse"/>
      <text x="44" y="28" class="node">DELIVERY</text>
      <text x="44" y="48" class="nodeSmall">CI/CD · GitOps</text>
    </g>

    <g transform="translate(396 0)" filter="url(#softShadow)">
      <rect width="152" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="25" cy="24" r="7" fill="#7C3AED" class="pulse"/>
      <text x="44" y="28" class="node">RUNTIME</text>
      <text x="44" y="48" class="nodeSmall">Containers · K8s</text>
    </g>

    <g transform="translate(594 0)" filter="url(#softShadow)">
      <rect width="152" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="25" cy="24" r="7" fill="#16A34A" class="pulse"/>
      <text x="44" y="28" class="node">OBSERVE</text>
      <text x="44" y="48" class="nodeSmall">Metrics · Logs</text>
    </g>

    <!-- moving packet -->
    <circle cx="28" cy="36" r="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5" class="packet" filter="url(#glow)"/>
  </g>

  <text x="64" y="408" class="kicker">BUILD · DEPLOY · OBSERVE · IMPROVE</text>
  <text x="1136" y="408" text-anchor="end" class="kicker">01 / 01</text>
</svg>
