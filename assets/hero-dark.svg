<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Vanshaj Agarwal · DevOps and Cloud Engineer</title>
<desc id="desc">A glass-style engineering pipeline connecting infrastructure, delivery, runtime, and observability.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#111827"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60A5FA"/><stop offset="0.55" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E293B" stop-opacity="0.72"/><stop offset="0.5" stop-color="#172033" stop-opacity="0.54"/><stop offset="1" stop-color="#111827" stop-opacity="0.68"/></linearGradient>
<filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/></filter>
<marker id="chevron" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1 L6 3.5 L1 6" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.kicker{font:700 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:2.6px;fill:#94A3B8}
.name{font:800 66px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-3.5px;fill:#F8FAFC;animation:nameIn .75s ease-out both}
.role{font:650 22px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#E2E8F0;animation:roleIn .65s ease-out .42s both}
.body{font:450 15px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94A3B8}
.node{font:750 11.5px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#E2E8F0;letter-spacing:.25px}
.nodeSmall{font:500 10px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94A3B8}
.flow{fill:none;stroke:url(#accent);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:8 10;animation:flow 1.6s linear infinite}
@keyframes nameIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes roleIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes flow{to{stroke-dashoffset:-36}}
</style>
</defs>
<rect x="2" y="2" width="1196" height="426" rx="28" fill="url(#bg)" stroke="#273449" stroke-width="2"/>
<rect x="62" y="58" width="38" height="4" rx="2" fill="url(#accent)"/>
<text x="62" y="88" class="kicker">DEVOPS · CLOUD · AUTOMATION</text>
<text x="62" y="166" class="name">Vanshaj Agarwal</text>
<text x="64" y="207" class="role">DevOps &amp; Cloud Engineer</text>
<text x="64" y="238" class="body">I build infrastructure, delivery pipelines, and automation that move systems reliably from code to production.</text>
<g transform="translate(105 304)">
<g><rect x="145" y="30" width="80" height="12" rx="6" fill="#0F172A" stroke="#334155"/><line x1="151" y1="36" x2="219" y2="36" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/><line x1="151" y1="36" x2="219" y2="36" class="flow" marker-end="url(#chevron)"/><circle cx="145" cy="36" r="3" fill="#60A5FA"/><circle cx="225" cy="36" r="3" fill="#22D3EE"/></g>
<g><rect x="370" y="30" width="80" height="12" rx="6" fill="#0F172A" stroke="#334155"/><line x1="376" y1="36" x2="444" y2="36" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/><line x1="376" y1="36" x2="444" y2="36" class="flow" style="animation-delay:.35s" marker-end="url(#chevron)"/><circle cx="370" cy="36" r="3" fill="#22D3EE"/><circle cx="450" cy="36" r="3" fill="#A78BFA"/></g>
<g><rect x="595" y="30" width="80" height="12" rx="6" fill="#0F172A" stroke="#334155"/><line x1="601" y1="36" x2="669" y2="36" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/><line x1="601" y1="36" x2="669" y2="36" class="flow" style="animation-delay:.7s" marker-end="url(#chevron)"/><circle cx="595" cy="36" r="3" fill="#A78BFA"/><circle cx="675" cy="36" r="3" fill="#4ADE80"/></g>
<g filter="url(#shadow)"><rect width="145" height="72" rx="18" fill="url(#glass)" stroke="#475569" stroke-opacity="0.78"/><path d="M18 1 H127" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5" stroke-linecap="round"/><circle cx="24" cy="24" r="6" fill="#60A5FA"/><text x="39" y="28" class="node">INFRASTRUCTURE</text><text x="39" y="48" class="nodeSmall">Terraform · Cloud</text></g>
<g transform="translate(225 0)" filter="url(#shadow)"><rect width="145" height="72" rx="18" fill="url(#glass)" stroke="#475569" stroke-opacity="0.78"/><path d="M18 1 H127" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5" stroke-linecap="round"/><circle cx="24" cy="24" r="6" fill="#22D3EE"/><text x="39" y="28" class="node">DELIVERY</text><text x="39" y="48" class="nodeSmall">CI/CD · GitOps</text></g>
<g transform="translate(450 0)" filter="url(#shadow)"><rect width="145" height="72" rx="18" fill="url(#glass)" stroke="#475569" stroke-opacity="0.78"/><path d="M18 1 H127" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5" stroke-linecap="round"/><circle cx="24" cy="24" r="6" fill="#A78BFA"/><text x="39" y="28" class="node">RUNTIME</text><text x="39" y="48" class="nodeSmall">Docker · Kubernetes</text></g>
<g transform="translate(675 0)" filter="url(#shadow)"><rect width="145" height="72" rx="18" fill="url(#glass)" stroke="#475569" stroke-opacity="0.78"/><path d="M18 1 H127" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5" stroke-linecap="round"/><circle cx="24" cy="24" r="6" fill="#4ADE80"/><text x="39" y="28" class="node">OBSERVE</text><text x="39" y="48" class="nodeSmall">Prometheus · Metrics</text></g>
</g>
<text x="64" y="408" class="kicker">BUILD · DEPLOY · OBSERVE · IMPROVE</text><text x="1136" y="408" text-anchor="end" class="kicker">01 / 01</text>
</svg>