<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Vanshaj Agarwal · DevOps and Cloud Engineer</title><desc id="desc">Animated engineering pipeline connecting infrastructure, delivery, runtime, and observability.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070D1A"/><stop offset=".55" stop-color="#0F172A"/><stop offset="1" stop-color="#111827"/></linearGradient><radialGradient id="halo"><stop offset="0" stop-color="#22D3EE" stop-opacity=".13"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient><linearGradient id="accent"><stop offset="0" stop-color="#60A5FA"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient><linearGradient id="glass" x2="0" y2="1"><stop offset="0" stop-color="#1E293B" stop-opacity=".86"/><stop offset=".5" stop-color="#172033" stop-opacity=".58"/><stop offset="1" stop-color="#111827" stop-opacity=".80"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".24"/></filter><filter id="glow"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="chevron" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1L6 3.5 1 6" fill="none" stroke="#22D3EE" stroke-width="1.5"/></marker>
<style>
.kicker{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2.6px;fill:#94A3B8}.name{font:800 66px ui-sans-serif,system-ui,sans-serif;letter-spacing:-3.5px;fill:#F8FAFC;animation:nameIn .8s cubic-bezier(.2,.8,.2,1) both}.role{font:650 22px ui-sans-serif,system-ui,sans-serif;fill:#E2E8F0;animation:roleIn .65s ease-out .38s both}.body{font:450 15px ui-sans-serif,system-ui,sans-serif;fill:#94A3B8;animation:bodyIn .65s ease-out .7s both}.node{font:750 11.5px ui-sans-serif,system-ui,sans-serif;fill:#E2E8F0}.nodeSmall{font:500 10px ui-sans-serif,system-ui,sans-serif;fill:#94A3B8}.flow{fill:none;stroke:url(#accent);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:8 10;animation:flow 1.45s linear infinite}.rail{fill:#0F172A;stroke:#334155;stroke-width:1}.card{opacity:0;animation:cardIn .65s ease-out forwards}.c1{animation-delay:.72s}.c2{animation-delay:.84s}.c3{animation-delay:.96s}.c4{animation-delay:1.08s}.cardPulse{opacity:.12;animation:cardPulse 5.8s ease-in-out infinite}.a2{animation-delay:1.45s}.a3{animation-delay:2.9s}.a4{animation-delay:4.35s}.pulse{animation:pulse 2.4s ease-in-out infinite}.pulse2{animation:pulse 2.4s ease-in-out .6s infinite}.packet{animation:packet 5.2s linear infinite}.packet2{animation:packet 5.2s linear 2.6s infinite}.scan{animation:scan 4.8s ease-in-out infinite}.particle{animation:particle 4s ease-in-out infinite}.p2{animation-delay:-1.4s}.p3{animation-delay:-2.8s}
@keyframes nameIn{from{opacity:0;transform:translateY(18px);filter:blur(5px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}@keyframes roleIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes bodyIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@keyframes cardIn{from{opacity:0}to{opacity:1}}@keyframes flow{to{stroke-dashoffset:-36}}@keyframes pulse{0%,100%{opacity:.42;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}@keyframes cardPulse{0%,100%{opacity:.08}45%{opacity:.42}60%{opacity:.08}}@keyframes packet{0%{opacity:0;transform:translateX(0)}6%{opacity:1}88%{opacity:1}100%{opacity:0;transform:translateX(820px)}}@keyframes scan{0%,100%{opacity:0;transform:translateX(-120px)}45%,55%{opacity:.7}75%{opacity:0;transform:translateX(920px)}}@keyframes particle{0%{opacity:0;transform:translate(0,8px)}25%{opacity:.55}70%{opacity:.25}100%{opacity:0;transform:translate(80px,-18px)}}
</style></defs>
