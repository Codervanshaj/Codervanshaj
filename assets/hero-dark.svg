<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Vanshaj Agarwal · DevOps and Cloud Engineer</title>
  <desc id="desc">A minimal dark-mode animated engineering hero with a calm flow from infrastructure to delivery and observability.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60A5FA"/><stop offset="0.55" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .kicker{font:700 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:2.8px;fill:#94A3B8}
      .name{font:800 66px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-3.5px;fill:#F8FAFC}
      .role{font:650 22px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#E2E8F0}
      .body{font:450 15px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94A3B8}
      .node{font:750 12px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#E2E8F0}
      .nodeSmall{font:500 10px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94A3B8}
      .flow{stroke-dasharray:8 13;animation:flow 4.8s linear infinite}
      .pulse{animation:pulse 2.6s ease-in-out infinite}
      .packet{animation:packet 4.8s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-105}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes packet{0%{transform:translateX(0)}100%{transform:translateX(744px)}}
    </style>
  </defs>
  <rect x="2" y="2" width="1196" height="426" rx="28" fill="url(#surface)" stroke="#273449" stroke-width="2"/>
  <rect x="62" y="58" width="38" height="4" rx="2" fill="url(#accent)"/>
  <text x="62" y="88" class="kicker">DEVOPS · CLOUD · AUTOMATION</text>
  <text x="62" y="166" class="name">Vanshaj Agarwal</text>
  <text x="64" y="207" class="role">DevOps &amp; Cloud Engineer</text>
  <text x="64" y="238" class="body">I build infrastructure, delivery pipelines, and automation that move systems reliably from code to production.</text>
  <g transform="translate(64 304)">
    <path d="M28 36 H772" stroke="#334155" stroke-width="2"/>
    <path d="M28 36 H772" stroke="url(#accent)" stroke-width="2.5" class="flow" filter="url(#glow)"/>
    <g><rect width="152" height="72" rx="16" fill="#111827" stroke="#334155"/><circle cx="25" cy="24" r="7" fill="#60A5FA" class="pulse"/><text x="44" y="28" class="node">INFRASTRUCTURE</text><text x="44" y="48" class="nodeSmall">Terraform · Cloud</text></g>
    <g transform="translate(198 0)"><rect width="152" height="72" rx="16" fill="#111827" stroke="#334155"/><circle cx="25" cy="24" r="7" fill="#22D3EE" class="pulse"/><text x="44" y="28" class="node">DELIVERY</text><text x="44" y="48" class="nodeSmall">CI/CD · GitOps</text></g>
    <g transform="translate(396 0)"><rect width="152" height="72" rx="16" fill="#111827" stroke="#334155"/><circle cx="25" cy="24" r="7" fill="#A78BFA" class="pulse"/><text x="44" y="28" class="node">RUNTIME</text><text x="44" y="48" class="nodeSmall">Containers · K8s</text></g>
    <g transform="translate(594 0)"><rect width="152" height="72" rx="16" fill="#111827" stroke="#334155"/><circle cx="25" cy="24" r="7" fill="#4ADE80" class="pulse"/><text x="44" y="28" class="node">OBSERVE</text><text x="44" y="48" class="nodeSmall">Metrics · Logs</text></g>
    <circle cx="28" cy="36" r="5" fill="#0B1120" stroke="#60A5FA" stroke-width="2.5" class="packet" filter="url(#glow)"/>
  </g>
  <text x="64" y="408" class="kicker">BUILD · DEPLOY · OBSERVE · IMPROVE</text>
  <text x="1136" y="408" text-anchor="end" class="kicker">01 / 01</text>
</svg>
