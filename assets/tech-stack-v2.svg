<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 820" role="img" aria-labelledby="t d"><title id="t">Technology Stack</title><desc id="d">A visual technology map for cloud, infrastructure, delivery, observability and development.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f7f9fc"/></linearGradient><linearGradient id="path" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#6366f1"/></linearGradient><style>.ey{font:700 15px ui-monospace,monospace;letter-spacing:3px;fill:#64748b}.h{font:800 48px ui-sans-serif,system-ui;letter-spacing:-2px;fill:#111827}.lead{font:400 19px ui-sans-serif,system-ui;fill:#64748b}.cat{font:800 20px ui-sans-serif,system-ui;fill:#111827}.tech{font:750 18px ui-sans-serif,system-ui;fill:#1e293b}.ctx{font:500 13px ui-sans-serif,system-ui;fill:#64748b}.line{stroke:#cbd5e1;stroke-width:2;fill:none}.node{fill:#fff;stroke:#cbd5e1;stroke-width:2}.logo{font:800 13px ui-monospace,monospace;fill:#2563eb}.techgrp{transition:transform .25s ease}.techgrp:hover{transform:translateY(-4px)}@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-80}}.flow{stroke-dasharray:8 12;animation:flow 5s linear infinite}</style></defs><rect width="1536" height="820" fill="url(#bg)"/><text x="768" y="52" text-anchor="middle" class="ey">TECHNOLOGY STACK</text><text x="768" y="108" text-anchor="middle" class="h">The tools behind my work.</text><text x="768" y="143" text-anchor="middle" class="lead">A focused stack, from infrastructure to application development.</text>
<!-- central flow --> <path d="M190 390 C410 230 510 230 690 390 S960 550 1345 390" class="line flow" stroke="url(#path)"/><circle cx="768" cy="390" r="6" fill="#6366f1"/>
<!-- cloud --> <g class="techgrp"><circle cx="170" cy="330" r="54" fill="#eff6ff" stroke="#bfdbfe"/><text x="170" y="325" text-anchor="middle" class="logo">CLOUD</text><text x="170" y="346" text-anchor="middle" class="ctx">platforms</text><text x="170" y="430" text-anchor="middle" class="cat">Cloud</text><text x="170" y="456" text-anchor="middle" class="tech">AWS · Azure</text></g>
<!-- infrastructure --> <g class="techgrp"><circle cx="450" cy="250" r="54" fill="#f5f3ff" stroke="#ddd6fe"/><text x="450" y="245" text-anchor="middle" class="logo">IaC</text><text x="450" y="266" text-anchor="middle" class="ctx">provisioning</text><text x="450" y="160" text-anchor="middle" class="cat">Infrastructure</text><text x="450" y="186" text-anchor="middle" class="tech">Terraform · Ansible</text></g>
<!-- delivery --> <g class="techgrp"><circle cx="720" cy="390" r="64" fill="#eef2ff" stroke="#c7d2fe"/><text x="720" y="384" text-anchor="middle" class="logo">SHIP</text><text x="720" y="406" text-anchor="middle" class="ctx">delivery</text><text x="720" y="490" text-anchor="middle" class="cat">Containers &amp; CI/CD</text><text x="720" y="516" text-anchor="middle" class="tech">Docker · Kubernetes · Helm</text><text x="720" y="539" text-anchor="middle" class="tech">GitHub Actions · Jenkins</text></g>
<!-- observability --> <g class="techgrp"><circle cx="1030" cy="250" r="54" fill="#fff7ed" stroke="#fed7aa"/><text x="1030" y="245" text-anchor="middle" class="logo" fill="#ea580c">OBS</text><text x="1030" y="266" text-anchor="middle" class="ctx">visibility</text><text x="1030" y="160" text-anchor="middle" class="cat">Observability</text><text x="1030" y="186" text-anchor="middle" class="tech">Prometheus · Grafana</text></g>
<!-- development --> <g class="techgrp"><circle cx="1335" cy="330" r="54" fill="#ecfdf5" stroke="#a7f3d0"/><text x="1335" y="325" text-anchor="middle" class="logo" fill="#059669">CODE</text><text x="1335" y="346" text-anchor="middle" class="ctx">development</text><text x="1335" y="430" text-anchor="middle" class="cat">Development</text><text x="1335" y="456" text-anchor="middle" class="tech">Python · TypeScript</text><text x="1335" y="479" text-anchor="middle" class="tech">Node.js · PowerShell</text></g>
<!-- footer --> <line x1="190" y1="640" x2="1345" y2="640" stroke="#e2e8f0"/><text x="768" y="690" text-anchor="middle" class="ctx">Cloud → Provision → Deliver → Observe → Build</text><text x="768" y="728" text-anchor="middle" class="tech">A practical stack for building, deploying, and operating reliable systems.</text></svg>