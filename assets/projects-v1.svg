<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 930" role="img" aria-labelledby="title desc"><title id="title">Projects</title><desc id="desc">Two project cards with larger, readable typography.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6F8FC"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563EB"/><stop offset="1" stop-color="#4F46E5"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#0F172A" flood-opacity=".10"/></filter><style>.ey{font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:3.5px;fill:#64748B}.h{font:800 50px ui-sans-serif,system-ui,sans-serif;letter-spacing:-2.4px;fill:#111827}.intro{font:400 20px ui-sans-serif,system-ui,sans-serif;fill:#64748B}.num{font:750 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;fill:#64748B}.title{font:800 34px ui-sans-serif,system-ui,sans-serif;letter-spacing:-1.2px;fill:#111827}.sub{font:650 20px ui-sans-serif,system-ui,sans-serif;fill:#334155}.body{font:500 20px ui-sans-serif,system-ui,sans-serif;fill:#475569}.label{font:800 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.3px;fill:#2563EB}.detail{font:550 18px ui-sans-serif,system-ui,sans-serif;fill:#334155}.tag{font:750 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334155}.card{transition:transform .28s ease}.card:hover{transform:translateY(-6px)}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}.pulse{animation:pulse 3s ease-in-out infinite}</style></defs><rect width="1536" height="930" fill="url(#bg)"/><text x="768" y="55" text-anchor="middle" class="ey">PROJECTS</text><text x="768" y="116" text-anchor="middle" class="h">Things I’ve been building.</text><text x="768" y="151" text-anchor="middle" class="intro">Projects that show how I approach infrastructure, automation, and real-world systems.</text><rect x="730" y="176" width="76" height="4" rx="2" fill="url(#blue)" class="pulse"/>
<g class="card" filter="url(#shadow)"><rect x="70" y="215" width="680" height="610" rx="28" fill="#FFFFFF" stroke="#DDE4EF"/><rect x="70" y="215" width="8" height="610" rx="4" fill="url(#blue)"/><circle cx="132" cy="274" r="34" fill="#EFF6FF" stroke="#BFDBFE"/><g transform="translate(109 251)" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="15" height="15" rx="3"/><rect x="40" y="3" width="15" height="15" rx="3"/><rect x="22" y="40" width="15" height="15" rx="3"/><path d="M18 11h22M48 18v10c0 6-4 11-11 11"/></g><text x="185" y="258" class="num">01 · DEVOPS</text><text x="185" y="305" class="title">Zero-Drift K8 Pipeline</text><text x="185" y="338" class="sub">GitOps-driven Kubernetes delivery</text><text x="110" y="397" class="body">A delivery pipeline built around GitOps, infrastructure</text><text x="110" y="426" class="body">as code, and continuous state reconciliation.</text><text x="110" y="478" class="label">BUILT WITH</text><rect x="110" y="494" width="128" height="36" rx="18" fill="#EFF6FF"/><text x="174" y="518" text-anchor="middle" class="tag">GITHUB ACTIONS</text><rect x="248" y="494" width="78" height="36" rx="18" fill="#F1F5F9"/><text x="287" y="518" text-anchor="middle" class="tag">DOCKER</text><rect x="336" y="494" width="68" height="36" rx="18" fill="#F1F5F9"/><text x="370" y="518" text-anchor="middle" class="tag">HELM</text><rect x="414" y="494" width="76" height="36" rx="18" fill="#F1F5F9"/><text x="452" y="518" text-anchor="middle" class="tag">ARGO CD</text><rect x="500" y="494" width="106" height="36" rx="18" fill="#F1F5F9"/><text x="553" y="518" text-anchor="middle" class="tag">KUBERNETES</text><text x="110" y="580" class="label">THE POINT</text><text x="110" y="610" class="detail">GitOps · IaC · CI/CD · Self-healing infrastructure</text><line x1="110" y1="653" x2="710" y2="653" stroke="#E2E8F0"/><text x="110" y="696" class="body">Terraform provisions the infrastructure, while Argo CD</text><text x="110" y="724" class="body">continuously keeps the deployed state aligned.</text><text x="110" y="782" class="label">OPEN PROJECT  →</text></g>
<g class="card" filter="url(#shadow)"><rect x="786" y="215" width="680" height="610" rx="28" fill="#FFFFFF" stroke="#DDE4EF"/><rect x="786" y="215" width="8" height="610" rx="4" fill="#6366F1"/><circle cx="848" cy="274" r="34" fill="#F5F3FF" stroke="#DDD6FE"/><g transform="translate(824 251)" fill="none" stroke="#6366F1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="6"/><circle cx="44" cy="6" r="6"/><circle cx="46" cy="42" r="6"/><circle cx="13" cy="48" r="6"/><path d="M15 10L38 7M14 17v25M18 47l21-5M48 12l-2 24"/></g><text x="901" y="258" class="num">02 · FULL STACK + AI</text><text x="901" y="305" class="title">AI Supply Chain</text><text x="901" y="338" class="sub">AI-assisted supply-chain platform</text><text x="826" y="397" class="body">A full-stack system connecting operational data, APIs,</text><text x="826" y="426" class="body">ERP ingestion, and AI-assisted workflows.</text><text x="826" y="478" class="label">BUILT WITH</text><rect x="826" y="494" width="82" height="36" rx="18" fill="#F5F3FF"/><text x="867" y="518" text-anchor="middle" class="tag">NEXT.JS</text><rect x="918" y="494" width="86" height="36" rx="18" fill="#F1F5F9"/><text x="961" y="518" text-anchor="middle" class="tag">FASTAPI</text><rect x="1014" y="494" width="106" height="36" rx="18" fill="#F1F5F9"/><text x="1067" y="518" text-anchor="middle" class="tag">POSTGRESQL</text><rect x="1130" y="494" width="66" height="36" rx="18" fill="#F1F5F9"/><text x="1163" y="518" text-anchor="middle" class="tag">REDIS</text><rect x="1206" y="494" width="110" height="36" rx="18" fill="#F1F5F9"/><text x="1261" y="518" text-anchor="middle" class="tag">AI WORKFLOWS</text><text x="826" y="580" class="label">THE POINT</text><text x="826" y="610" class="detail">AI · APIs · Data workflows · Full-stack systems</text><line x1="826" y1="653" x2="1426" y2="653" stroke="#E2E8F0"/><text x="826" y="696" class="body">Persistent operational data with an application layer</text><text x="826" y="724" class="body">designed around real supply-chain workflows.</text><text x="826" y="782" class="label">OPEN PROJECT  →</text><rect x="1350" y="246" width="88" height="34" rx="17" fill="#ECFDF5" stroke="#BBF7D0"/><text x="1394" y="269" text-anchor="middle" class="tag" fill="#047857">ACTIVE</text></g></svg>