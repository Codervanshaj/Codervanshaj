<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 900" role="img" aria-labelledby="title desc">
<title id="title">Selected Projects</title><desc id="desc">Two selected projects: Zero-Drift K8 Pipeline and AI Supply Chain.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F7F9FC"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563EB"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
 <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8FAFF"/></linearGradient>
 <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#FAFAFF"/></linearGradient>
 <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.08"/></filter>
 <style>
  .eyebrow{font:700 16px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:4px;fill:#64748B}
  .headline{font:800 52px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-2.5px;fill:#111827}
  .lead{font:400 20px ui-sans-serif,system-ui,sans-serif;fill:#64748B}
  .num{font:800 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;fill:#64748B}
  .title{font:800 30px ui-sans-serif,system-ui,sans-serif;letter-spacing:-1px;fill:#111827}
  .subtitle{font:650 17px ui-sans-serif,system-ui,sans-serif;fill:#334155}
  .body{font:400 17px ui-sans-serif,system-ui,sans-serif;fill:#64748B}
  .tag{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.7px;fill:#475569}
  .meta{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.2px;fill:#2563EB}
  .small{font:500 13px ui-sans-serif,system-ui,sans-serif;fill:#64748B}
  .card{transition:transform .28s ease,filter .28s ease}
  .card:hover{transform:translateY(-5px)}
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:.9}}
  .pulse{animation:breathe 3.5s ease-in-out infinite}
 </style>
</defs>
<rect width="1536" height="900" fill="url(#bg)"/>
<text x="768" y="56" text-anchor="middle" class="eyebrow">SELECTED PROJECTS</text>
<text x="768" y="116" text-anchor="middle" class="headline">Things I’ve been building.</text>
<text x="768" y="151" text-anchor="middle" class="lead">A couple of projects that show how I approach infrastructure, automation, and systems.</text>
<rect x="735" y="176" width="66" height="3" rx="1.5" fill="url(#accent)" class="pulse"/>

<!-- Project 1 -->
<g class="card" filter="url(#shadow)">
 <rect x="88" y="220" width="660" height="570" rx="22" fill="url(#card1)" stroke="#E2E8F0"/>
 <rect x="88" y="220" width="6" height="570" rx="3" fill="url(#accent)"/>
 <circle cx="145" cy="279" r="31" fill="#EFF6FF" stroke="#DBEAFE"/>
 <!-- pipeline icon -->
 <g transform="translate(124 258)" fill="none" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="3" width="14" height="14" rx="3"/><rect x="35" y="3" width="14" height="14" rx="3"/><rect x="19" y="35" width="14" height="14" rx="3"/>
  <path d="M17 10h18M42 17v9c0 5-3 9-9 9h0"/>
 </g>
 <text x="198" y="264" class="num">PROJECT 01</text>
 <text x="198" y="301" class="title">Zero-Drift K8 Pipeline</text>
 <text x="198" y="330" class="subtitle">GitOps-driven Kubernetes delivery</text>
 <text x="122" y="388" class="body">A delivery pipeline built around GitOps, infrastructure as</text>
 <text x="122" y="414" class="body">code, and continuous reconciliation of the desired state.</text>
 <text x="122" y="461" class="meta">STACK</text>
 <rect x="122" y="477" width="101" height="30" rx="15" fill="#F1F5F9"/><text x="172" y="497" text-anchor="middle" class="tag">GITHUB ACTIONS</text>
 <rect x="231" y="477" width="68" height="30" rx="15" fill="#F1F5F9"/><text x="265" y="497" text-anchor="middle" class="tag">DOCKER</text>
 <rect x="307" y="477" width="59" height="30" rx="15" fill="#F1F5F9"/><text x="336" y="497" text-anchor="middle" class="tag">HELM</text>
 <rect x="374" y="477" width="67" height="30" rx="15" fill="#F1F5F9"/><text x="407" y="497" text-anchor="middle" class="tag">ARGO CD</text>
 <rect x="449" y="477" width="92" height="30" rx="15" fill="#F1F5F9"/><text x="495" y="497" text-anchor="middle" class="tag">KUBERNETES</text>
 <text x="122" y="557" class="meta">WHAT IT SHOWS</text>
 <text x="122" y="585" class="small">GitOps · Kubernetes · IaC · CI/CD · Self-healing</text>
 <line x1="122" y1="632" x2="714" y2="632" stroke="#E2E8F0"/>
 <text x="122" y="672" class="small">Infrastructure is provisioned with Terraform, then</text>
 <text x="122" y="696" class="small">continuously reconciled through Argo CD.</text>
 <text x="122" y="744" class="meta">VIEW PROJECT  →</text>
</g>

<!-- Project 2 -->
<g class="card" filter="url(#shadow)">
 <rect x="788" y="220" width="660" height="570" rx="22" fill="url(#card2)" stroke="#E2E8F0"/>
 <rect x="788" y="220" width="6" height="570" rx="3" fill="#6366F1"/>
 <circle cx="845" cy="279" r="31" fill="#F5F3FF" stroke="#EDE9FE"/>
 <!-- data / AI icon -->
 <g transform="translate(824 258)" fill="none" stroke="#6366F1" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="8" cy="11" r="5"/><circle cx="40" cy="5" r="5"/><circle cx="42" cy="37" r="5"/><circle cx="12" cy="43" r="5"/>
  <path d="M13 9L35 6M12 15l0 23M16 42l21-4M43 10l-1 22"/>
 </g>
 <text x="898" y="264" class="num">PROJECT 02</text>
 <text x="898" y="301" class="title">AI Supply Chain</text>
 <text x="898" y="330" class="subtitle">AI-assisted supply-chain platform</text>
 <text x="822" y="388" class="body">A full-stack system connecting operational data, APIs,</text>
 <text x="822" y="414" class="body">persistent ERP ingestion, and AI-assisted workflows.</text>
 <text x="822" y="461" class="meta">STACK</text>
 <rect x="822" y="477" width="72" height="30" rx="15" fill="#F1F5F9"/><text x="858" y="497" text-anchor="middle" class="tag">NEXT.JS</text>
 <rect x="902" y="477" width="75" height="30" rx="15" fill="#F1F5F9"/><text x="939" y="497" text-anchor="middle" class="tag">FASTAPI</text>
 <rect x="985" y="477" width="94" height="30" rx="15" fill="#F1F5F9"/><text x="1032" y="497" text-anchor="middle" class="tag">POSTGRESQL</text>
 <rect x="1087" y="477" width="57" height="30" rx="15" fill="#F1F5F9"/><text x="1115" y="497" text-anchor="middle" class="tag">REDIS</text>
 <rect x="1152" y="477" width="75" height="30" rx="15" fill="#F1F5F9"/><text x="1190" y="497" text-anchor="middle" class="tag">AI WORKFLOWS</text>
 <text x="822" y="557" class="meta">WHAT IT SHOWS</text>
 <text x="822" y="585" class="small">AI · APIs · Data workflows · Full-stack systems</text>
 <line x1="822" y1="632" x2="1414" y2="632" stroke="#E2E8F0"/>
 <text x="822" y="672" class="small">Persistent operational data with a modern application</text>
 <text x="822" y="696" class="small">layer designed around real supply-chain workflows.</text>
 <text x="822" y="744" class="meta">VIEW PROJECT  →</text>
 <rect x="1330" y="252" width="83" height="28" rx="14" fill="#ECFDF5" stroke="#D1FAE5"/><text x="1371" y="271" text-anchor="middle" class="tag" fill="#047857">ACTIVE</text>
</g>
</svg>