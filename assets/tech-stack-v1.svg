<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 790" role="img" aria-labelledby="title desc"><title id="title">Technology Stack</title><desc id="desc">A clean technology map grouped into cloud, delivery, observability, and development.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8FAFC"/></linearGradient><linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563EB"/><stop offset="1" stop-color="#6366F1"/></linearGradient><style>.ey{font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:3.5px;fill:#64748B}.h{font:800 50px ui-sans-serif,system-ui,sans-serif;letter-spacing:-2.3px;fill:#111827}.lead{font:400 19px ui-sans-serif,system-ui,sans-serif;fill:#64748B}.group{font:800 22px ui-sans-serif,system-ui,sans-serif;fill:#111827}.desc{font:500 15px ui-sans-serif,system-ui,sans-serif;fill:#64748B}.name{font:750 19px ui-sans-serif,system-ui,sans-serif;fill:#1E293B}.tiny{font:500 13px ui-sans-serif,system-ui,sans-serif;fill:#64748B}.dot{fill:#2563EB}@keyframes float{0%,100%{opacity:.45}50%{opacity:1}}.glow{animation:float 3.2s ease-in-out infinite}</style></defs><rect width="1536" height="790" fill="url(#bg)"/><text x="768" y="55" text-anchor="middle" class="ey">TECHNOLOGY STACK</text><text x="768" y="115" text-anchor="middle" class="h">The tools behind the work.</text><text x="768" y="149" text-anchor="middle" class="lead">A focused stack across infrastructure, delivery, reliability, and development.</text><rect x="728" y="176" width="80" height="4" rx="2" fill="url(#rule)" class="glow"/>
<!-- Cloud --> <g><text x="92" y="246" class="group">Cloud &amp; Infrastructure</text><text x="92" y="273" class="desc">Where systems are provisioned and managed.</text><line x1="92" y1="295" x2="1444" y2="295" stroke="#E2E8F0"/><g transform="translate(92 337)"><circle cx="5" cy="-5" r="4" class="dot"/><text x="22" y="2" class="name">AWS</text><text x="22" y="25" class="tiny">Cloud</text><circle cx="270" cy="-5" r="4" class="dot"/><text x="287" y="2" class="name">Azure</text><text x="287" y="25" class="tiny">Cloud</text><circle cx="540" cy="-5" r="4" class="dot"/><text x="557" y="2" class="name">Terraform</text><text x="557" y="25" class="tiny">Infrastructure as Code</text><circle cx="860" cy="-5" r="4" class="dot"/><text x="877" y="2" class="name">Ansible</text><text x="877" y="25" class="tiny">Configuration</text><circle cx="1120" cy="-5" r="4" class="dot"/><text x="1137" y="2" class="name">Cloudflare</text><text x="1137" y="25" class="tiny">Edge &amp; Security</text></g></g>
<!-- Delivery --> <g><text x="92" y="432" class="group">Delivery &amp; Automation</text><text x="92" y="459" class="desc">How code moves from repository to running systems.</text><line x1="92" y1="481" x2="1444" y2="481" stroke="#E2E8F0"/><g transform="translate(92 523)"><circle cx="5" cy="-5" r="4" fill="#4F46E5"/><text x="22" y="2" class="name">Docker</text><text x="22" y="25" class="tiny">Containers</text><circle cx="270" cy="-5" r="4" fill="#4F46E5"/><text x="287" y="2" class="name">Kubernetes</text><text x="287" y="25" class="tiny">Orchestration</text><circle cx="540" cy="-5" r="4" fill="#4F46E5"/><text x="557" y="2" class="name">Helm</text><text x="557" y="25" class="tiny">Packaging</text><circle cx="760" cy="-5" r="4" fill="#4F46E5"/><text x="777" y="2" class="name">GitHub Actions</text><text x="777" y="25" class="tiny">CI/CD</text><circle cx="1080" cy="-5" r="4" fill="#4F46E5"/><text x="1097" y="2" class="name">Jenkins</text><text x="1097" y="25" class="tiny">Automation</text></g></g>
<!-- Observability --> <g><text x="92" y="618" class="group">Observability &amp; Reliability</text><text x="92" y="645" class="desc">Tools I use to understand what systems are doing.</text><line x1="92" y1="667" x2="1444" y2="667" stroke="#E2E8F0"/><g transform="translate(92 709)"><circle cx="5" cy="-5" r="4" fill="#EA580C"/><text x="22" y="2" class="name">Prometheus</text><text x="22" y="25" class="tiny">Metrics</text><circle cx="330" cy="-5" r="4" fill="#EA580C"/><text x="347" y="2" class="name">Grafana</text><text x="347" y="25" class="tiny">Dashboards</text><circle cx="600" cy="-5" r="4" fill="#EA580C"/><text x="617" y="2" class="name">New Relic</text><text x="617" y="25" class="tiny">Monitoring</text><circle cx="900" cy="-5" r="4" fill="#EA580C"/><text x="917" y="2" class="name">ELK Stack</text><text x="917" y="25" class="tiny">Logs</text><circle cx="1160" cy="-5" r="4" fill="#EA580C"/><text x="1177" y="2" class="name">Git</text><text x="1177" y="25" class="tiny">Version Control</text></g></g></svg>