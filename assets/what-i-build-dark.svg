<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">What I Build</title><desc id="desc">Cloud infrastructure, delivery automation, reliability and engineering capabilities.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090F1C"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="blue" x1="0" x2="1"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="34"/></filter><style>.kicker{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2.6px;fill:#94A3B8}.heading{font:850 60px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-3.4px;fill:#F8FAFC}.lead{font:500 17px ui-sans-serif,system-ui,sans-serif;fill:#94A3B8}.title{font:800 29px ui-sans-serif,system-ui,sans-serif;letter-spacing:-1.1px;fill:#F1F5F9}.body{font:450 15px ui-sans-serif,system-ui,sans-serif;fill:#94A3B8}.stack{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.9px;fill:#CBD5E1}.number{font:800 18px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#64748B}.item{animation:enter .7s cubic-bezier(.2,.8,.2,1) both}.i2{animation-delay:.12s}.i3{animation-delay:.24s}.i4{animation-delay:.36s}.glyph{animation:float 5s ease-in-out infinite}.g2{animation-delay:1s}.g3{animation-delay:2s}.g4{animation-delay:3s}.glow{animation:glow 4.8s ease-in-out infinite}.x2{animation-delay:1.2s}.x3{animation-delay:2.4s}.x4{animation-delay:3.6s}@keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes glow{0%,100%{opacity:.12}50%{opacity:.6}}</style></defs><rect x="2" y="2" width="1196" height="756" rx="28" fill="url(#bg)" stroke="#273449" stroke-width="2"/><circle cx="1040" cy="110" r="120" fill="#2563EB" opacity=".08" filter="url(#blur)"/><circle cx="150" cy="670" r="100" fill="#7C3AED" opacity=".06" filter="url(#blur)"/><text x="600" y="78" text-anchor="middle" class="kicker">WHAT I BUILD</text><text x="600" y="145" text-anchor="middle" class="heading">Engineering systems that keep moving.</text><text x="600" y="181" text-anchor="middle" class="lead">From cloud foundations to production feedback, I build the pieces that make delivery reliable.</text><g class="item"><text x="78" y="270" class="number">01</text><text x="126" y="270" class="title">Cloud Infrastructure</text><text x="126" y="304" class="body">Automated cloud foundations designed to be repeatable, scalable, and easy to evolve.</text><text x="126" y="337" class="stack">AWS · AZURE · TERRAFORM · BICEP</text><g class="glyph" transform="translate(1030 245)" fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="28" width="52" height="32" rx="7"/><rect x="28" y="0" width="52" height="32" rx="7"/><rect x="56" y="56" width="52" height="32" rx="7"/><path d="M80 16L108 56"/><circle cx="14" cy="44" r="3" fill="#60A5FA" stroke="none"/></g><rect class="glow" x="126" y="357" width="900" height="2" rx="1" fill="url(#blue)"/></g><g class="item i2"><text x="78" y="402" class="number">02</text><text x="126" y="402" class="title">Delivery Automation</text><text x="126" y="436" class="body">CI/CD and GitOps workflows that move changes from commit to production with control.</text><text x="126" y="469" class="stack">GITHUB ACTIONS · JENKINS · HELM · ARGO CD</text><g class="glyph g2" transform="translate(1030 376)" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M0 45H92" stroke-width="6"/><path d="M72 26L94 45 72 64" stroke-width="5"/><circle cx="10" cy="16" r="8" fill="#164E63"/><circle cx="38" cy="16" r="8" fill="#155E75"/><circle cx="66" cy="16" r="8" fill="#0E7490"/></g><rect class="glow x2" x="126" y="489" width="900" height="2" rx="1" fill="#22D3EE"/></g><g class="item i3"><text x="78" y="534" class="number">03</text><text x="126" y="534" class="title">Reliability &amp; Observability</text><text x="126" y="568" class="body">Metrics, dashboards, and alerts that turn system behaviour into useful engineering feedback.</text><text x="126" y="601" class="stack">PROMETHEUS · GRAFANA · CLOUDWATCH · ALERTING</text><g class="glyph g3" transform="translate(1030 507)" fill="none" stroke="#A78BFA" stroke-width="3" stroke-linecap="round"><path d="M0 62C15 62 18 22 34 22S51 51 67 51 82 10 104 10"/><circle cx="104" cy="10" r="4" fill="#A78BFA" stroke="none"/></g><rect class="glow x3" x="126" y="621" width="900" height="2" rx="1" fill="#A78BFA"/></g><g class="item i4"><text x="78" y="666" class="number">04</text><text x="126" y="666" class="title">Engineering</text><text x="126" y="700" class="body">Infrastructure, automation, scripting, and application code connected end to end.</text><text x="126" y="733" class="stack">PYTHON · POWERSHELL · TYPESCRIPT · NODE.JS</text><g class="glyph g4" transform="translate(1030 639)" fill="none" stroke="#4ADE80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M32 5L8 48 32 91"/><path d="M72 5L96 48 72 91"/><path d="M61 0L43 96"/></g></g></svg>