<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">What I Build</title><desc id="desc">Editorial animated overview of cloud infrastructure, delivery automation, reliability, and engineering.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080D18"/><stop offset=".6" stop-color="#0F172A"/><stop offset="1" stop-color="#111827"/></linearGradient>
<linearGradient id="blue" x1="0" x2="1"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
<style>
.eyebrow{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:3px;fill:#94A3B8}.headline{font:850 68px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-5px;fill:#F8FAFC}.aside{font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.2px;fill:#64748B}.name{font:850 43px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-2.5px;fill:#F1F5F9}.copy{font:500 15px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94A3B8}.tags{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:#CBD5E1}.num{font:800 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.5px;fill:#64748B}.row{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}.r1{animation-delay:.1s}.r2{animation-delay:.24s}.r3{animation-delay:.38s}.r4{animation-delay:.52s}.word{animation:word .9s cubic-bezier(.2,.8,.2,1) both}.r1 .word{animation-delay:.12s}.r2 .word{animation-delay:.26s}.r3 .word{animation-delay:.4s}.r4 .word{animation-delay:.54s}.mark{transform-origin:left center;animation:mark 4.8s ease-in-out infinite}.m2{animation-delay:1.2s}.m3{animation-delay:2.4s}.m4{animation-delay:3.6s}.glyph{animation:glyph 4s ease-in-out infinite}.g2{animation-delay:1s}.g3{animation-delay:2s}.g4{animation-delay:3s}.beam{animation:beam 6s ease-in-out infinite}@keyframes rise{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:translateX(0)}}@keyframes word{from{opacity:0;transform:translateX(-22px);letter-spacing:-1px}to{opacity:1;transform:translateX(0);letter-spacing:-2.5px}}@keyframes mark{0%,100%{opacity:.15;transform:scaleX(.45)}45%{opacity:.9;transform:scaleX(1)}65%{opacity:.2;transform:scaleX(.72)}}@keyframes glyph{0%,100%{opacity:.42;transform:translateY(0) rotate(0)}50%{opacity:1;transform:translateY(-6px) rotate(1deg)}}@keyframes beam{0%,100%{opacity:0;transform:translateX(-100px)}20%{opacity:.45}55%{opacity:0;transform:translateX(1060px)}}
</style></defs>
<rect x="2" y="2" width="1196" height="596" rx="26" fill="url(#bg)" stroke="#273449" stroke-width="2"/>
<text x="54" y="60" class="eyebrow">02 / CAPABILITIES</text><text x="54" y="132" class="headline">WHAT I BUILD</text><text x="1146" y="60" text-anchor="end" class="aside">INFRASTRUCTURE / DELIVERY / RELIABILITY / ENGINEERING</text>
<rect x="54" y="151" width="118" height="5" rx="2.5" fill="url(#blue)"/><text x="54" y="181" class="aside">SYSTEMS, NOT A SHOPPING LIST OF TOOLS.</text>

<g class="row r1"><text x="54" y="235" class="num">01</text><text x="122" y="239" class="name word">CLOUD INFRASTRUCTURE</text><text x="122" y="267" class="copy">The foundation: provisioned, repeatable, and built to scale.</text><text x="122" y="293" class="tags">AWS · AZURE · TERRAFORM · BICEP · ARM</text><g class="glyph" transform="translate(1040 220)"><rect x="0" y="25" width="44" height="22" rx="5" fill="#172554"/><rect x="17" y="0" width="44" height="22" rx="5" fill="#1E3A8A"/><rect x="34" y="50" width="44" height="22" rx="5" fill="#0C4A6E"/><path d="M58 11L84 36" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/></g><rect x="122" y="311" width="300" height="5" rx="2.5" fill="#60A5FA" class="mark"/></g>

<g class="row r2"><text x="54" y="334" class="num">02</text><text x="122" y="338" class="name word">DELIVERY AUTOMATION</text><text x="122" y="366" class="copy">The path: every change gets a controlled route to production.</text><text x="122" y="392" class="tags">GITHUB ACTIONS · JENKINS · HELM · ARGO CD · GITOPS</text><g class="glyph g2" transform="translate(1038 320)"><path d="M0 32H72" stroke="#22D3EE" stroke-width="7" stroke-linecap="round"/><path d="M55 14L75 32 55 50" fill="none" stroke="#22D3EE" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="0" y="2" width="16" height="16" rx="3" fill="#164E63"/><rect x="25" y="46" width="16" height="16" rx="3" fill="#155E75"/></g><rect x="122" y="410" width="355" height="5" rx="2.5" fill="#22D3EE" class="mark m2"/></g>

<g class="row r3"><text x="54" y="433" class="num">03</text><text x="122" y="437" class="name word">RELIABILITY / OBSERVABILITY</text><text x="122" y="465" class="copy">The feedback: see system behaviour, diagnose it, improve it.</text><text x="122" y="491" class="tags">PROMETHEUS · GRAFANA · CLOUDWATCH · METRICS · ALERTING</text><g class="glyph g3" transform="translate(1035 418)"><path d="M0 45C12 45 12 15 25 15S38 52 51 52 64 23 78 23" fill="none" stroke="#A78BFA" stroke-width="5" stroke-linecap="round"/><path d="M0 65H78" stroke="#4C1D95" stroke-width="8" stroke-linecap="round"/></g><rect x="122" y="509" width="330" height="5" rx="2.5" fill="#A78BFA" class="mark m3"/></g>

<g class="row r4"><text x="54" y="532" class="num">04</text><text x="122" y="536" class="name word">ENGINEERING / END TO END</text><text x="600" y="536" class="copy">Infrastructure, automation, and application code in one system.</text><text x="600" y="562" class="tags">PYTHON · POWERSHELL · TYPESCRIPT · NODE.JS · APIs</text><g class="glyph g4" transform="translate(1040 510)"><path d="M18 2L2 32 18 62" fill="none" stroke="#4ADE80" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 2L78 32 62 62" fill="none" stroke="#4ADE80" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 0L32 66" stroke="#166534" stroke-width="5" stroke-linecap="round"/></g><rect x="122" y="548" width="380" height="5" rx="2.5" fill="#4ADE80" class="mark m4"/></g>
<rect class="beam" x="54" y="202" width="3" height="340" rx="1.5" fill="#22D3EE" filter="url(#blur)" opacity="0"/>
</svg>