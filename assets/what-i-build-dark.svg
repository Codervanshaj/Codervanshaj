<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">What I Build</title><desc id="desc">Cloud infrastructure, delivery automation, reliability and observability, and engineering.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101F"/><stop offset="1" stop-color="#0D1728"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38BDF8"/><stop offset=".52" stop-color="#818CF8"/><stop offset="1" stop-color="#C084FC"/></linearGradient><radialGradient id="glowA"><stop stop-color="#2563EB" stop-opacity=".18"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient><radialGradient id="glowB"><stop stop-color="#7C3AED" stop-opacity=".13"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="34"/></filter><filter id="iconGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.eyebrow{font:700 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:4px;fill:#94A3B8}.headline{font:850 58px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-3px;fill:#F8FAFC}.intro{font:500 17px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94A3B8}.number{font:850 62px ui-sans-serif,system-ui,sans-serif;letter-spacing:-3px;fill:#172235}.title{font:800 30px ui-sans-serif,system-ui,sans-serif;letter-spacing:-1.2px;fill:#F8FAFC}.copy{font:450 16px ui-sans-serif,system-ui,sans-serif;fill:#A8B4C7}.stack{font:700 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:1.4px;fill:#7DD3FC}.row{animation:enter .75s cubic-bezier(.2,.8,.2,1) both}.r1{animation-delay:.08s}.r2{animation-delay:.18s}.r3{animation-delay:.28s}.r4{animation-delay:.38s}.icon{animation:float 5s ease-in-out infinite}.i2{animation-delay:1s}.i3{animation-delay:2s}.i4{animation-delay:3s}@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}</style></defs>
<rect x="1.5" y="1.5" width="1197" height="717" rx="28" fill="url(#bg)" stroke="#233149" stroke-width="2"/><circle cx="1010" cy="80" r="180" fill="url(#glowA)" filter="url(#blur)"/><circle cx="150" cy="620" r="150" fill="url(#glowB)" filter="url(#blur)"/>
<text x="600" y="68" text-anchor="middle" class="eyebrow">WHAT I BUILD</text><rect x="548" y="91" width="104" height="2" rx="1" fill="url(#accent)" opacity=".85"/><text x="600" y="151" text-anchor="middle" class="headline">Systems that move from code to production.</text><text x="600" y="187" text-anchor="middle" class="intro">End-to-end systems built with infrastructure as code, automation at every step, and reliability by design.</text>
<g class="row r1"><text x="72" y="286" class="number">01</text><line x1="190" y1="226" x2="190" y2="316" stroke="#334155" stroke-width="1"/><text x="226" y="251" class="title">Cloud Infrastructure</text><text x="226" y="281" class="copy">Designing and automating scalable, secure, and cost-aware cloud foundations that are built to evolve.</text><text x="226" y="310" class="stack">AWS  ·  AZURE  ·  TERRAFORM  ·  BICEP  ·  ARM</text><g class="icon" transform="translate(1030 235)" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#iconGlow)"><path d="M18 43h54M25 43V28h40v15M33 28V13h40v15M41 13V4h40v9"/><path d="M50 19h14M50 34h14M50 49h14"/><circle cx="44" cy="19" r="2" fill="#38BDF8" stroke="none"/><circle cx="44" cy="34" r="2" fill="#818CF8" stroke="none"/><circle cx="44" cy="49" r="2" fill="#C084FC" stroke="none"/></g></g>
<g class="row r2"><text x="72" y="388" class="number">02</text><line x1="190" y1="328" x2="190" y2="418" stroke="#334155" stroke-width="1"/><text x="226" y="353" class="title">Delivery Automation</text><text x="226" y="383" class="copy">Automating the path from commit to production with reliable pipelines, quality gates, and repeatable deployments.</text><text x="226" y="412" class="stack">GITHUB ACTIONS  ·  JENKINS  ·  HELM  ·  ARGO CD</text><g class="icon i2" transform="translate(1030 340)" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#iconGlow)"><circle cx="10" cy="34" r="7"/><circle cx="52" cy="15" r="7"/><circle cx="94" cy="34" r="7"/><path d="M17 31L45 18M59 18L87 31"/><path d="M76 24l18 10-18 10"/></g></g>
<g class="row r3"><text x="72" y="490" class="number">03</text><line x1="190" y1="430" x2="190" y2="520" stroke="#334155" stroke-width="1"/><text x="226" y="455" class="title">Reliability &amp; Observability</text><text x="226" y="485" class="copy">Building visibility into system behaviour through metrics, dashboards, alerts, and useful operational feedback.</text><text x="226" y="514" class="stack">PROMETHEUS  ·  GRAFANA  ·  CLOUDWATCH  ·  ALERTING</text><g class="icon i3" transform="translate(1030 443)" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#iconGlow)"><rect x="4" y="5" width="88" height="57" rx="8"/><path d="M18 45h15l8-20 10 29 10-18 10 9h14"/><circle cx="18" cy="16" r="2" fill="#38BDF8" stroke="none"/><circle cx="28" cy="16" r="2" fill="#818CF8" stroke="none"/></g></g>
<g class="row r4"><text x="72" y="592" class="number">04</text><line x1="190" y1="532" x2="190" y2="622" stroke="#334155" stroke-width="1"/><text x="226" y="557" class="title">Engineering</text><text x="226" y="587" class="copy">Connecting infrastructure, automation, scripting, and application code to solve systems end to end.</text><text x="226" y="616" class="stack">PYTHON  ·  POWERSHELL  ·  TYPESCRIPT  ·  NODE.JS</text><g class="icon i4" transform="translate(1030 545)" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#iconGlow)"><rect x="3" y="5" width="92" height="62" rx="8"/><path d="M28 32l-12 10 12 10M70 32l12 10-12 10M57 25L43 59"/><circle cx="17" cy="17" r="2" fill="#38BDF8" stroke="none"/><circle cx="26" cy="17" r="2" fill="#818CF8" stroke="none"/><circle cx="35" cy="17" r="2" fill="#C084FC" stroke="none"/></g></g>
</svg>