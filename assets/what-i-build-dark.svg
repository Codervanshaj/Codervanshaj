<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">What I Build</title><desc id="desc">A clean animated overview of cloud infrastructure, delivery automation, reliability, and engineering.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090F1C"/><stop offset="1" stop-color="#111827"/></linearGradient>
<linearGradient id="blue" x1="0" x2="1"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<filter id="soft"><feGaussianBlur stdDeviation="30"/></filter>
<style>
.eyebrow{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2.8px;fill:#94A3B8}.headline{font:850 62px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-3.8px;fill:#F8FAFC}.intro{font:500 17px ui-sans-serif,system-ui,sans-serif;fill:#94A3B8}.title{font:800 30px ui-sans-serif,system-ui,sans-serif;letter-spacing:-1.3px;fill:#F1F5F9}.copy{font:450 15px ui-sans-serif,system-ui,sans-serif;fill:#94A3B8}.tags{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:#CBD5E1}.num{font:850 58px ui-sans-serif,system-ui,sans-serif;letter-spacing:-3px;fill:#182234}.row{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}.r1{animation-delay:.15s}.r2{animation-delay:.3s}.r3{animation-delay:.45s}.r4{animation-delay:.6s}.glyph{animation:float 5s ease-in-out infinite}.g2{animation-delay:1s}.g3{animation-delay:2s}.g4{animation-delay:3s}.accent{animation:accent 5.5s ease-in-out infinite}.a2{animation-delay:1.3s}.a3{animation-delay:2.6s}.a4{animation-delay:3.9s}.orb{animation:orb 9s ease-in-out infinite}@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes accent{0%,100%{opacity:.12;transform:scaleX(.45);transform-origin:left}45%{opacity:.75;transform:scaleX(1)}65%{opacity:.15;transform:scaleX(.7)}}@keyframes orb{0%,100%{opacity:.14;transform:translate(0,0)}50%{opacity:.25;transform:translate(18px,-10px)}}
</style></defs>
<rect x="2" y="2" width="1196" height="696" rx="28" fill="url(#bg)" stroke="#273449" stroke-width="2"/>
<circle class="orb" cx="1050" cy="85" r="105" fill="#2563EB" filter="url(#soft)"/><circle class="orb" cx="150" cy="610" r="100" fill="#7C3AED" filter="url(#soft)"/>
<text x="600" y="70" text-anchor="middle" class="eyebrow">WHAT I BUILD</text>
<text x="600" y="142" text-anchor="middle" class="headline">Systems that move from code to production.</text>
<text x="600" y="177" text-anchor="middle" class="intro">Infrastructure, delivery, reliability, and engineering working together.</text>
<g class="row r1"><text x="74" y="266" class="num">01</text><text x="164" y="245" class="title">Cloud Infrastructure</text><text x="164" y="279" class="copy">I design and automate cloud foundations that are repeatable, scalable, and easy to change.</text><text x="164" y="311" class="tags">AWS · AZURE · TERRAFORM · BICEP · ARM</text><g class="glyph" transform="translate(1040 223)" stroke="#60A5FA" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="32" width="48" height="28" rx="6"/><rect x="24" y="0" width="48" height="28" rx="6"/><rect x="48" y="64" width="48" height="28" rx="6"/><path d="M72 14L96 46"/><circle cx="12" cy="46" r="3" fill="#60A5FA" stroke="none"/></g><rect class="accent" x="164" y="335" width="820" height="3" rx="1.5" fill="url(#blue)"/></g>
<g class="row r2"><text x="74" y="370" class="num">02</text><text x="164" y="349" class="title">Delivery Automation</text><text x="164" y="383" class="copy">I build controlled CI/CD and GitOps paths that take changes from commit to production.</text><text x="164" y="415" class="tags">GITHUB ACTIONS · JENKINS · HELM · ARGO CD</text><g class="glyph g2" transform="translate(1040 325)" stroke="#22D3EE" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M0 42H82" stroke-width="6"/><path d="M64 24L84 42 64 60" stroke-width="5"/><rect x="0" y="7" width="17" height="17" rx="3" fill="#164E63"/><rect x="26" y="7" width="17" height="17" rx="3" fill="#155E75"/><rect x="52" y="7" width="17" height="17" rx="3" fill="#0E7490"/></g><rect class="accent a2" x="164" y="439" width="820" height="3" rx="1.5" fill="#22D3EE"/></g>
<g class="row r3"><text x="74" y="474" class="num">03</text><text x="164" y="453" class="title">Reliability &amp; Observability</text><text x="164" y="487" class="copy">I make system behaviour visible through metrics, dashboards, alerts, and useful feedback.</text><text x="164" y="519" class="tags">PROMETHEUS · GRAFANA · CLOUDWATCH · ALERTING</text><g class="glyph g3" transform="translate(1040 427)" fill="none" stroke="#A78BFA" stroke-width="3" stroke-linecap="round"><path d="M0 70C15 70 17 25 32 25S49 58 64 58 78 12 96 12"/><path d="M0 78H96" stroke="#4C1D95" stroke-width="8"/></g><rect class="accent a3" x="164" y="543" width="820" height="3" rx="1.5" fill="#A78BFA"/></g>
<g class="row r4"><text x="74" y="578" class="num">04</text><text x="164" y="557" class="title">Engineering</text><text x="164" y="591" class="copy">I connect infrastructure, automation, scripting, and application code to solve systems end to end.</text><text x="164" y="623" class="tags">PYTHON · POWERSHELL · TYPESCRIPT · NODE.JS</text><g class="glyph g4" transform="translate(1040 531)" fill="none" stroke="#4ADE80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M30 8L8 48 30 88"/><path d="M66 8L88 48 66 88"/><path d="M56 4L40 92"/></g><rect class="accent a4" x="164" y="647" width="820" height="3" rx="1.5" fill="#4ADE80"/></g>
</svg>