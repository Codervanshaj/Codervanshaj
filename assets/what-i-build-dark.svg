<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">What I Build</title><desc id="desc">Four animated engineering capabilities: Cloud and Infrastructure, Delivery and Automation, Reliability, and Engineering.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080F1D"/><stop offset=".55" stop-color="#0F172A"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#60A5FA"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.eyebrow{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:3px;fill:#94A3B8}.heading{font:800 42px ui-sans-serif,system-ui,sans-serif;letter-spacing:-1.8px;fill:#F8FAFC}.intro{font:450 15px ui-sans-serif,system-ui,sans-serif;fill:#94A3B8}.title{font:750 18px ui-sans-serif,system-ui,sans-serif;fill:#F1F5F9}.body{font:450 12.5px ui-sans-serif,system-ui,sans-serif;fill:#94A3B8}.tech{font:650 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.7px;fill:#CBD5E1}.num{font:800 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:#64748B}.card{opacity:0;animation:enter .75s cubic-bezier(.2,.8,.2,1) forwards}.one{animation-delay:.25s}.two{animation-delay:.4s}.three{animation-delay:.55s}.four{animation-delay:.7s}.icon{animation:iconIn .8s ease-out forwards}.accent{stroke:url(#accent);stroke-width:3;stroke-linecap:round;fill:none}.sweep{animation:sweep 5s ease-in-out infinite}.shine{animation:shine 5.5s ease-in-out infinite}.s2{animation-delay:1.3s}.s3{animation-delay:2.6s}.s4{animation-delay:3.9s}@keyframes enter{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}@keyframes iconIn{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}@keyframes sweep{0%,100%{opacity:0;transform:translateX(-180px)}15%{opacity:.7}45%{opacity:0;transform:translateX(400px)}}@keyframes shine{0%,100%{opacity:0}35%{opacity:.5}55%{opacity:0}}</style></defs><rect x="2" y="2" width="1196" height="616" rx="28" fill="url(#bg)" stroke="#273449" stroke-width="2"/><rect x="54" y="48" width="42" height="4" rx="2" fill="url(#accent)"/><text x="54" y="78" class="eyebrow">CAPABILITY / 04</text><text x="54" y="125" class="heading">What I Build</text><text x="54" y="153" class="intro">Systems designed to move cleanly from infrastructure to delivery, reliability, and engineering.</text><path d="M54 178H1146" stroke="#334155" stroke-width="1.2"/><path d="M54 178H310" class="accent sweep" opacity=".8"/><g class="card one" filter="url(#shadow)"><rect x="54" y="210" width="526" height="164" rx="22" fill="#111C2E" stroke="#334155"/><path d="M54 232Q54 210 76 210H558Q580 210 580 232" fill="none" stroke="#60A5FA" stroke-opacity=".6" stroke-width="2"/><text x="82" y="242" class="num">01</text><g class="icon" transform="translate(505 236)" stroke="#60A5FA" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-18 8H16M-14 8V-4M-2 8V-14M10 8V-22"/><path d="M-19 -4L-2 -14 10 -22 18 -10"/><circle cx="-14" cy="-4" r="3" fill="#60A5FA" stroke="none"/><circle cx="-2" cy="-14" r="3" fill="#60A5FA" stroke="none"/><circle cx="10" cy="-22" r="3" fill="#60A5FA" stroke="none"/></g><text x="82" y="282" class="title">Cloud &amp; Infrastructure</text><text x="82" y="308" class="body">Designing and automating infrastructure with AWS, Azure,</text><text x="82" y="327" class="body">Terraform, Bicep and ARM templates.</text><text x="82" y="354" class="tech">AWS  /  AZURE  /  TERRAFORM  /  BICEP</text><rect class="shine" x="80" y="209" width="3" height="165" fill="#60A5FA" filter="url(#glow)"/></g><g class="card two" filter="url(#shadow)"><rect x="620" y="210" width="526" height="164" rx="22" fill="#101F2A" stroke="#334155"/><path d="M620 232Q620 210 642 210H1124Q1146 210 1146 232" fill="none" stroke="#22D3EE" stroke-opacity=".6" stroke-width="2"/><text x="648" y="242" class="num">02</text><g class="icon" transform="translate(1071 238)" stroke="#22D3EE" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-22 0H18"/><path d="M8 -10L18 0 8 10"/><rect x="-23" y="-16" width="10" height="10" rx="2"/><rect x="-7" y="-16" width="10" height="10" rx="2"/><rect x="9" y="-16" width="10" height="10" rx="2"/></g><text x="648" y="282" class="title">Delivery &amp; Automation</text><text x="648" y="308" class="body">Building CI/CD and GitOps workflows that turn changes</text><text x="648" y="327" class="body">into repeatable, controlled deployments.</text><text x="648" y="354" class="tech">GITHUB ACTIONS  /  JENKINS  /  HELM  /  ARGO CD</text><rect class="shine s2" x="646" y="209" width="3" height="165" fill="#22D3EE" filter="url(#glow)"/></g><g class="card three" filter="url(#shadow)"><rect x="54" y="400" width="526" height="164" rx="22" fill="#17152B" stroke="#334155"/><path d="M54 422Q54 400 76 400H558Q580 400 580 422" fill="none" stroke="#A78BFA" stroke-opacity=".6" stroke-width="2"/><text x="82" y="432" class="num">03</text><g class="icon" transform="translate(505 428)" stroke="#A78BFA" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-20 8H20"/><path d="M-15 3V-10M0 3V-19M15 3V-5"/><path d="M-19 -3L-8 -7 1 -15 10 -9 20 -15"/><circle cx="-8" cy="-7" r="2.5" fill="#A78BFA" stroke="none"/><circle cx="1" cy="-15" r="2.5" fill="#A78BFA" stroke="none"/></g><text x="82" y="472" class="title">Reliability</text><text x="82" y="498" class="body">Making systems observable, diagnosable, and easier to</text><text x="82" y="517" class="body">operate through metrics, dashboards, and feedback loops.</text><text x="82" y="544" class="tech">PROMETHEUS  /  GRAFANA  /  CLOUDWATCH</text><rect class="shine s3" x="80" y="399" width="3" height="165" fill="#A78BFA" filter="url(#glow)"/></g><g class="card four" filter="url(#shadow)"><rect x="620" y="400" width="526" height="164" rx="22" fill="#10241D" stroke="#334155"/><path d="M620 422Q620 400 642 400H1124Q1146 400 1146 422" fill="none" stroke="#4ADE80" stroke-opacity=".6" stroke-width="2"/><text x="648" y="432" class="num">04</text><g class="icon" transform="translate(1071 428)" stroke="#4ADE80" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-18 -14L-27 -5 -18 4"/><path d="M18 -14L27 -5 18 4"/><path d="M7 -21L-7 11"/><path d="M-6 21H20"/><path d="M-6 21L0 15"/><path d="M-6 21L0 27"/></g><text x="648" y="472" class="title">Engineering</text><text x="648" y="498" class="body">Combining infrastructure, scripting, and application</text><text x="648" y="517" class="body">development to solve the problem end to end.</text><text x="648" y="544" class="tech">PYTHON  /  POWERSHELL  /  TYPESCRIPT  /  NODE.JS</text><rect class="shine s4" x="646" y="399" width="3" height="165" fill="#4ADE80" filter="url(#glow)"/></g></svg>