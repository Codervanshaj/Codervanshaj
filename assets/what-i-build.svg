<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">What I Build</title>
<desc id="desc">Four animated engineering capabilities: Cloud and Infrastructure, Delivery and Automation, Reliability, and Engineering.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset=".55" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5F9"/></linearGradient>
<linearGradient id="accent" x1="0" x2="1"><stop stop-color="#2563EB"/><stop offset=".5" stop-color="#0891B2"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
<linearGradient id="card1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EFF6FF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
<linearGradient id="card2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ECFEFF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
<linearGradient id="card3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F3FF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
<linearGradient id="card4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F0FDF4"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity=".08"/></filter>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.eyebrow{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:3px;fill:#64748B}.heading{font:800 42px ui-sans-serif,system-ui,sans-serif;letter-spacing:-1.8px;fill:#0F172A}.intro{font:450 15px ui-sans-serif,system-ui,sans-serif;fill:#64748B}.title{font:750 18px ui-sans-serif,system-ui,sans-serif;fill:#0F172A}.body{font:450 12.5px ui-sans-serif,system-ui,sans-serif;fill:#64748B}.tech{font:650 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.7px;fill:#475569}.num{font:800 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:#94A3B8}.card{opacity:0;animation:enter .75s cubic-bezier(.2,.8,.2,1) forwards}.one{animation-delay:.25s}.two{animation-delay:.4s}.three{animation-delay:.55s}.four{animation-delay:.7s}.icon{animation:iconIn .8s ease-out forwards}.accent{stroke:url(#accent);stroke-width:3;stroke-linecap:round;fill:none}.sweep{animation:sweep 5s ease-in-out infinite}.breathe{animation:breathe 4s ease-in-out infinite}.b2{animation-delay:1.1s}.b3{animation-delay:2.2s}.b4{animation-delay:3.3s}.line{stroke:#CBD5E1;stroke-width:1.2}.shine{animation:shine 5.5s ease-in-out infinite}.s2{animation-delay:1.3s}.s3{animation-delay:2.6s}.s4{animation-delay:3.9s}
@keyframes enter{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}@keyframes iconIn{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}@keyframes sweep{0%,100%{opacity:0;transform:translateX(-180px)}15%{opacity:.7}45%{opacity:0;transform:translateX(400px)}}@keyframes breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}@keyframes shine{0%,100%{opacity:0}35%{opacity:.5}55%{opacity:0}}
</style></defs>
<rect x="2" y="2" width="1196" height="616" rx="28" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<rect x="54" y="48" width="42" height="4" rx="2" fill="url(#accent)"/><text x="54" y="78" class="eyebrow">CAPABILITY / 04</text><text x="54" y="125" class="heading">What I Build</text><text x="54" y="153" class="intro">Systems designed to move cleanly from infrastructure to delivery, reliability, and engineering.</text><path d="M54 178H1146" class="line"/><path d="M54 178H310" class="accent sweep" opacity=".8"/>
<g class="card one" filter="url(#shadow)"><rect x="54" y="210" width="526" height="164" rx="22" fill="url(#card1)" stroke="#D9E2EC"/><path d="M54 232Q54 210 76 210H558Q580 210 580 232" fill="none" stroke="#2563EB" stroke-opacity=".5" stroke-width="2"/><text x="82" y="242" class="num">01</text><g class="icon" transform="translate(505 236)" stroke="#2563EB" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-18 8H16M-14 8V-4M-2 8V-14M10 8V-22"/><path d="M-19 -4L-2 -14 10 -22 18 -10"/><circle cx="-14" cy="-4" r="3" fill="#2563EB" stroke="none"/><circle cx="-2" cy="-14" r="3" fill="#2563EB" stroke="none"/><circle cx="10" cy="-22" r="3" fill="#2563EB" stroke="none"/></g><text x="82" y="282" class="title">Cloud &amp; Infrastructure</text><text x="82" y="308" class="body">Designing and automating infrastructure with AWS, Azure,</text><text x="82" y="327" class="body">Terraform, Bicep and ARM templates.</text><text x="82" y="354" class="tech">AWS  /  AZURE  /  TERRAFORM  /  BICEP</text><path d="M82 355H350" stroke="#2563EB" stroke-width="1" opacity=".15"/><rect class="shine" x="80" y="209" width="3" height="165" fill="#2563EB" filter="url(#glow)"/></g>
<g class="card two" filter="url(#shadow)"><rect x="620" y="210" width="526" height="164" rx="22" fill="url(#card2)" stroke="#D9E2EC"/><path d="M620 232Q620 210 642 210H1124Q1146 210 1146 232" fill="none" stroke="#0891B2" stroke-opacity=".5" stroke-width="2"/><text x="648" y="242" class="num">02</text><g class="icon" transform="translate(1071 238)" stroke="#0891B2" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-22 0H18"/><path d="M8 -10L18 0 8 10"/><rect x="-23" y="-16" width="10" height="10" rx="2"/><rect x="-7" y="-16" width="10" height="10" rx="2"/><rect x="9" y="-16" width="10" height="10" rx="2"/></g><text x="648" y="282" class="title">Delivery &amp; Automation</text><text x="648" y="308" class="body">Building CI/CD and GitOps workflows that turn changes</text><text x="648" y="327" class="body">into repeatable, controlled deployments.</text><text x="648" y="354" class="tech">GITHUB ACTIONS  /  JENKINS  /  HELM  /  ARGO CD</text><path d="M648 355H965" stroke="#0891B2" stroke-width="1" opacity=".15"/><rect class="shine s2" x="646" y="209" width="3" height="165" fill="#0891B2" filter="url(#glow)"/></g>
<g class="card three" filter="url(#shadow)"><rect x="54" y="400" width="526" height="164" rx="22" fill="url(#card3)" stroke="#D9E2EC"/><path d="M54 422Q54 400 76 400H558Q580 400 580 422" fill="none" stroke="#7C3AED" stroke-opacity=".5" stroke-width="2"/><text x="82" y="432" class="num">03</text><g class="icon" transform="translate(505 428)" stroke="#7C3AED" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-20 8H20"/><path d="M-15 3V-10M0 3V-19M15 3V-5"/><path d="M-19 -3L-8 -7 1 -15 10 -9 20 -15"/><circle cx="-8" cy="-7" r="2.5" fill="#7C3AED" stroke="none"/><circle cx="1" cy="-15" r="2.5" fill="#7C3AED" stroke="none"/></g><text x="82" y="472" class="title">Reliability</text><text x="82" y="498" class="body">Making systems observable, diagnosable, and easier to</text><text x="82" y="517" class="body">operate through metrics, dashboards, and feedback loops.</text><text x="82" y="544" class="tech">PROMETHEUS  /  GRAFANA  /  CLOUDWATCH</text><path d="M82 545H365" stroke="#7C3AED" stroke-width="1" opacity=".15"/><rect class="shine s3" x="80" y="399" width="3" height="165" fill="#7C3AED" filter="url(#glow)"/></g>
<g class="card four" filter="url(#shadow)"><rect x="620" y="400" width="526" height="164" rx="22" fill="url(#card4)" stroke="#D9E2EC"/><path d="M620 422Q620 400 642 400H1124Q1146 400 1146 422" fill="none" stroke="#16A34A" stroke-opacity=".5" stroke-width="2"/><text x="648" y="432" class="num">04</text><g class="icon" transform="translate(1071 428)" stroke="#16A34A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-18 -14L-27 -5  -18 4"/><path d="M18 -14L27 -5 18 4"/><path d="M7 -21L-7 11"/><path d="M-6 21H20"/><path d="M-6 21L0 15"/><path d="M-6 21L0 27"/></g><text x="648" y="472" class="title">Engineering</text><text x="648" y="498" class="body">Combining infrastructure, scripting, and application</text><text x="648" y="517" class="body">development to solve the problem end to end.</text><text x="648" y="544" class="tech">PYTHON  /  POWERSHELL  /  TYPESCRIPT  /  NODE.JS</text><path d="M648 545H976" stroke="#16A34A" stroke-width="1" opacity=".15"/><rect class="shine s4" x="646" y="399" width="3" height="165" fill="#16A34A" filter="url(#glow)"/></g>
</svg>