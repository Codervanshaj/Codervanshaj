<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">What I Build</title><desc id="desc">A clean, animated capability section covering cloud infrastructure, delivery automation, reliability, and engineering.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F7FA"/></linearGradient>
<linearGradient id="blue" x1="0" x2="1"><stop stop-color="#2563EB"/><stop offset="1" stop-color="#06B6D4"/></linearGradient>
<linearGradient id="violet" x1="0" x2="1"><stop stop-color="#7C3AED"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
<filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
<style>
.eyebrow{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:3px;fill:#64748B}.headline{font:850 58px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-3.5px;fill:#0F172A}.intro{font:450 16px ui-sans-serif,system-ui,sans-serif;fill:#64748B}.title{font:800 27px ui-sans-serif,system-ui,sans-serif;letter-spacing:-1.2px;fill:#111827}.copy{font:450 13.5px ui-sans-serif,system-ui,sans-serif;fill:#64748B}.tags{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.2px;fill:#475569}.num{font:850 78px ui-sans-serif,system-ui,sans-serif;letter-spacing:-5px;fill:#E8EDF4}.row{animation:rise .75s cubic-bezier(.2,.8,.2,1) both}.r1{animation-delay:.15s}.r2{animation-delay:.28s}.r3{animation-delay:.41s}.r4{animation-delay:.54s}.title{animation:titleIn .75s cubic-bezier(.2,.8,.2,1) both}.t2{animation-delay:.12s}.t3{animation-delay:.24s}.t4{animation-delay:.36s}.glyph{animation:float 4.8s ease-in-out infinite}.g2{animation-delay:.9s}.g3{animation-delay:1.8s}.g4{animation-delay:2.7s}.accent{animation:accent 5s ease-in-out infinite}.a2{animation-delay:1.25s}.a3{animation-delay:2.5s}.a4{animation-delay:3.75s}.orb{animation:orb 8s ease-in-out infinite}@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@keyframes titleIn{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes accent{0%,100%{opacity:.18;transform:scaleX(.55);transform-origin:left}45%{opacity:.8;transform:scaleX(1)}65%{opacity:.2;transform:scaleX(.72)}}@keyframes orb{0%,100%{opacity:.22;transform:translate(0,0)}50%{opacity:.4;transform:translate(18px,-12px)}}
</style></defs>
<rect x="2" y="2" width="1196" height="606" rx="28" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<circle class="orb" cx="1060" cy="82" r="100" fill="#2563EB" opacity=".18" filter="url(#soft)"/><circle class="orb" cx="165" cy="540" r="90" fill="#7C3AED" opacity=".12" filter="url(#soft)"/>
<text x="600" y="62" text-anchor="middle" class="eyebrow">CAPABILITIES</text><text x="600" y="126" text-anchor="middle" class="headline">WHAT I BUILD</text><text x="600" y="158" text-anchor="middle" class="intro">Cloud infrastructure, delivery systems, reliability, and software engineered as one.</text>
<g class="row r1"><text x="70" y="248" class="num">01</text><text x="172" y="218" class="title">Cloud Infrastructure</text><text x="172" y="246" class="copy">Provisioned, repeatable infrastructure built for scale and change.</text><text x="172" y="274" class="tags">AWS · AZURE · TERRAFORM · BICEP · ARM</text><g class="glyph" transform="translate(535 205)" stroke="#2563EB" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="32" width="48" height="28" rx="6"/><rect x="24" y="0" width="48" height="28" rx="6"/><rect x="48" y="64" width="48" height="28" rx="6"/><path d="M72 14L96 46"/><circle cx="12" cy="46" r="3" fill="#2563EB" stroke="none"/></g><rect class="accent" x="172" y="292" width="390" height="3" rx="1.5" fill="url(#blue)" opacity=".2"/></g>
<g class="row r2"><text x="628" y="248" class="num">02</text><text x="730" y="218" class="title t2">Delivery Automation</text><text x="730" y="246" class="copy">Controlled paths that move every change from commit to production.</text><text x="730" y="274" class="tags">GITHUB ACTIONS · JENKINS · HELM · ARGO CD</text><g class="glyph g2" transform="translate(1072 207)" stroke="#0891B2" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M0 42H82" stroke-width="6"/><path d="M64 24L84 42 64 60" stroke-width="5"/><rect x="0" y="7" width="17" height="17" rx="3" fill="#E0F2FE"/><rect x="26" y="7" width="17" height="17" rx="3" fill="#CFFAFE"/><rect x="52" y="7" width="17" height="17" rx="3" fill="#A5F3FC"/></g><rect class="accent a2" x="730" y="292" width="390" height="3" rx="1.5" fill="#0891B2" opacity=".2"/></g>
<g class="row r3"><text x="70" y="422" class="num">03</text><text x="172" y="392" class="title t3">Reliability &amp; Observability</text><text x="172" y="420" class="copy">Signals that make system behaviour visible, diagnosable, and actionable.</text><text x="172" y="448" class="tags">PROMETHEUS · GRAFANA · CLOUDWATCH · ALERTING</text><g class="glyph g3" transform="translate(535 380)" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"><path d="M0 70C15 70 17 25 32 25S49 58 64 58 78 12 96 12"/><path d="M0 78H96" stroke="#DDD6FE" stroke-width="8"/></g><rect class="accent a3" x="172" y="466" width="390" height="3" rx="1.5" fill="#7C3AED" opacity=".2"/></g>
<g class="row r4"><text x="628" y="422" class="num">04</text><text x="730" y="392" class="title t4">Engineering</text><text x="730" y="420" class="copy">Infrastructure, automation, and application code working end to end.</text><text x="730" y="448" class="tags">PYTHON · POWERSHELL · TYPESCRIPT · NODE.JS</text><g class="glyph g4" transform="translate(1072 380)" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M30 8L8 48 30 88"/><path d="M66 8L88 48 66 88"/><path d="M56 4L40 92"/></g><rect class="accent a4" x="730" y="466" width="390" height="3" rx="1.5" fill="#16A34A" opacity=".2"/></g>
</svg>