<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">What I Build</title><desc id="desc">A typographic overview of cloud infrastructure, delivery automation, reliability, and engineering.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF2F7"/></linearGradient>
<linearGradient id="rule" x1="0" x2="1"><stop stop-color="#2563EB"/><stop offset=".5" stop-color="#0891B2"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
<filter id="soft"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.k{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:3px;fill:#64748B}.big{font:850 70px ui-sans-serif,system-ui,sans-serif;letter-spacing:-4px;fill:#0F172A}.sub{font:450 14px ui-sans-serif,system-ui,sans-serif;fill:#64748B}.item{font:800 31px ui-sans-serif,system-ui,sans-serif;letter-spacing:-1.5px;fill:#111827}.desc{font:450 12.5px ui-sans-serif,system-ui,sans-serif;fill:#64748B}.num{font:800 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;fill:#94A3B8}.tag{font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.5px;fill:#475569}.row{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}.r1{animation-delay:.15s}.r2{animation-delay:.3s}.r3{animation-delay:.45s}.r4{animation-delay:.6s}.draw{stroke-dasharray:360;stroke-dashoffset:360;animation:draw 1.3s ease-out forwards}.d2{animation-delay:.35s}.d3{animation-delay:.5s}.d4{animation-delay:.65s}.pulse{animation:pulse 4s ease-in-out infinite}.p2{animation-delay:1s}.p3{animation-delay:2s}.p4{animation-delay:3s}.sweep{animation:sweep 6s ease-in-out infinite}.icon{animation:icon .8s cubic-bezier(.2,.8,.2,1) forwards;transform-origin:center}.i2{animation-delay:.3s}.i3{animation-delay:.45s}.i4{animation-delay:.6s}
@keyframes rise{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:translateX(0)}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}@keyframes sweep{0%,100%{opacity:0;transform:translateX(-120px)}25%{opacity:.65}50%{opacity:0;transform:translateX(1050px)}}@keyframes icon{from{opacity:0;transform:scale(.65) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(0)}}
</style></defs>
<rect x="2" y="2" width="1196" height="536" rx="30" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/>
<g opacity=".28"><path d="M58 82H1142" stroke="#CBD5E1"/><path d="M58 478H1142" stroke="#CBD5E1"/></g>
<text x="58" y="70" class="k">02 / CAPABILITIES</text>
<text x="58" y="151" class="big">I BUILD</text>
<text x="61" y="180" class="sub">Infrastructure, delivery systems, reliability, and software that work together.</text>
<rect x="58" y="202" width="5" height="232" rx="2.5" fill="url(#rule)"/>
<text x="58" y="474" class="k">FROM CODE → SYSTEM</text>

<g class="row r1"><text x="118" y="242" class="num">01</text><text x="178" y="244" class="item">CLOUD INFRASTRUCTURE</text><text x="178" y="270" class="desc">AWS · Azure · Terraform · Bicep</text><g class="icon" transform="translate(1080 236)" stroke="#2563EB" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-30 13H30M-23 13V-2M-8 13V-15M8 13V-27M23 13V-8"/><path d="M-26 -2L-8 -15 8 -27 25 -16"/><circle cx="-23" cy="-2" r="3" fill="#2563EB" stroke="none"/></g><path class="draw" d="M178 290H1140" stroke="#CBD5E1"/><path d="M178 290H380" stroke="#2563EB" stroke-width="2"/><circle class="pulse" cx="380" cy="290" r="3" fill="#2563EB"/></g>

<g class="row r2"><text x="118" y="329" class="num">02</text><text x="178" y="331" class="item">DELIVERY AUTOMATION</text><text x="178" y="357" class="desc">GitHub Actions · Jenkins · Helm · Argo CD</text><g class="icon i2" transform="translate(1080 323)" stroke="#0891B2" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-35 0H25"/><path d="M15 -10L27 0 15 10"/><rect x="-34" y="-18" width="11" height="11" rx="2"/><rect x="-17" y="-18" width="11" height="11" rx="2"/><rect x="0" y="-18" width="11" height="11" rx="2"/></g><path class="draw d2" d="M178 377H1140" stroke="#CBD5E1"/><path d="M178 377H540" stroke="#0891B2" stroke-width="2"/><circle class="pulse p2" cx="540" cy="377" r="3" fill="#0891B2"/></g>

<g class="row r3"><text x="118" y="416" class="num">03</text><text x="178" y="418" class="item">RELIABILITY &amp; OBSERVABILITY</text><text x="178" y="444" class="desc">Prometheus · Grafana · CloudWatch</text><g class="icon i3" transform="translate(1080 410)" stroke="#7C3AED" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-34 15H34"/><path d="M-29 8L-16 -2-3 4 12 -19 31 -7"/><circle cx="12" cy="-19" r="3" fill="#7C3AED" stroke="none"/></g><path class="draw d3" d="M178 464H1140" stroke="#CBD5E1"/><path d="M178 464H680" stroke="#7C3AED" stroke-width="2"/><circle class="pulse p3" cx="680" cy="464" r="3" fill="#7C3AED"/></g>

<g class="row r4"><text x="118" y="503" class="num">04</text><text x="178" y="505" class="item">ENGINEERING</text><text x="405" y="505" class="desc">Python · PowerShell · TypeScript · Node.js</text><g class="icon i4" transform="translate(1080 497)" stroke="#16A34A" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-25 -14L-38 -1-25 12M25 -14L38 -1 25 12M8 -20L-8 18"/></g><circle class="pulse p4" cx="780" cy="505" r="3" fill="#16A34A"/></g>
<rect class="sweep" x="58" y="202" width="2" height="232" rx="1" fill="#0891B2" filter="url(#soft)" opacity="0"/>
</svg>