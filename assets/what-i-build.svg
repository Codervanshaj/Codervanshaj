<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">What I Build</title><desc id="desc">Cloud infrastructure, delivery automation, reliability and engineering.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F7FB"/></linearGradient><linearGradient id="grad" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563EB"/><stop offset=".52" stop-color="#6366F1"/><stop offset="1" stop-color="#A855F7"/></linearGradient><radialGradient id="light"><stop stop-color="#6366F1" stop-opacity=".09"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="32"/></filter><filter id="iconGlow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.label{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:3px;fill:#64748B}.headline{font:850 54px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-2.8px;fill:#111827}.lead{font:450 17px ui-sans-serif,system-ui,sans-serif;fill:#64748B}.num{font:850 54px ui-sans-serif,system-ui,sans-serif;letter-spacing:-2px;fill:url(#grad)}.title{font:800 29px ui-sans-serif,system-ui,sans-serif;letter-spacing:-1px;fill:#111827}.body{font:450 15px ui-sans-serif,system-ui,sans-serif;fill:#64748B}.stack{font:750 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.1px;fill:#4F6FD8}.row{animation:rise .75s cubic-bezier(.2,.8,.2,1) both}.r2{animation-delay:.12s}.r3{animation-delay:.24s}.r4{animation-delay:.36s}.icon{animation:iconPulse 5s ease-in-out infinite}.i2{animation-delay:1s}.i3{animation-delay:2s}.i4{animation-delay:3s}.glow{animation:pulse 4s ease-in-out infinite}.g2{animation-delay:1s}.g3{animation-delay:2s}.g4{animation-delay:3s}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes iconPulse{0%,100%{opacity:.82}50%{opacity:1}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}</style></defs><rect x="2" y="2" width="1196" height="816" rx="26" fill="url(#bg)" stroke="#E2E8F0" stroke-width="2"/><circle cx="600" cy="15" r="300" fill="url(#light)"/><circle cx="1030" cy="95" r="90" fill="#2563EB" opacity=".05" filter="url(#blur)"/><text x="600" y="56" text-anchor="middle" class="label">WHAT I BUILD</text><text x="600" y="112" text-anchor="middle" class="headline">Systems that move</text><text x="600" y="168" text-anchor="middle" class="headline">from <tspan fill="url(#grad)">code to production.</tspan></text><text x="600" y="210" text-anchor="middle" class="lead">End-to-end systems built with infrastructure as code,</text><text x="600" y="234" text-anchor="middle" class="lead">automation at every step, and reliability by design.</text><g class="row"><text x="70" y="326" class="num">01</text><line x1="154" y1="272" x2="154" y2="348" stroke="url(#grad)" stroke-width="1.5" opacity=".7"/><text x="192" y="296" class="title">Cloud Infrastructure</text><text x="192" y="323" class="body">Designing and automating scalable, secure, and cost-effective cloud foundations</text><text x="192" y="344" class="body">that are built to evolve with your needs.</text><text x="192" y="372" class="stack">AWS · AZURE · TERRAFORM · BICEP · ARM</text><g class="icon" transform="translate(1010 282)" fill="none" stroke="url(#grad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#iconGlow)"><path d="M28 55C8 55 3 38 11 26C16 18 24 15 34 17C38 5 50 0 61 4C72 7 78 15 78 26C92 26 101 36 101 48C101 61 91 70 78 70H28C15 70 7 64 7 55Z"/><rect x="29" y="48" width="46" height="14" rx="4"/><rect x="29" y="63" width="46" height="14" rx="4"/><circle cx="65" cy="55" r="2" fill="#6366F1" stroke="none"/><circle cx="65" cy="70" r="2" fill="#A855F7" stroke="none"/></g><rect class="glow" x="980" y="365" width="130" height="2" rx="1" fill="url(#grad)"/></g><line x1="56" y1="402" x2="1144" y2="402" stroke="#E2E8F0" stroke-width="1"/><g class="row r2"><text x="70" y="454" class="num">02</text><line x1="154" y1="400" x2="154" y2="476" stroke="url(#grad)" stroke-width="1.5" opacity=".7"/><text x="192" y="424" class="title">Delivery Automation</text><text x="192" y="451" class="body">Automating the path from code to production with reliable pipelines,</text><text x="192" y="472" class="body">quality gates, and consistent deployments.</text><text x="192" y="500" class="stack">GITHUB ACTIONS · JENKINS · HELM · ARGO CD</text><g class="icon i2" transform="translate(1004 412)" fill="none" stroke="url(#grad)" stroke-width="2.8" stroke-linecap="round"><path d="M10 37C35 5 61 5 86 37C61 69 35 69 10 37Z"/><path d="M67 37H89M80 29L89 37 80 45"/></g><rect class="glow g2" x="980" y="493" width="130" height="2" rx="1" fill="url(#grad)"/></g><line x1="56" y1="530" x2="1144" y2="530" stroke="#E2E8F0" stroke-width="1"/><g class="row r3"><text x="70" y="582" class="num">03</text><line x1="154" y1="528" x2="154" y2="604" stroke="url(#grad)" stroke-width="1.5" opacity=".7"/><text x="192" y="552" class="title">Reliability &amp; Observability</text><text x="192" y="579" class="body">Building visibility into systems with metrics, logs, and intelligent alerts</text><text x="192" y="600" class="body">so issues are detected before users feel them.</text><text x="192" y="628" class="stack">PROMETHEUS · GRAFANA · CLOUDWATCH · ALERTING</text><g class="icon i3" transform="translate(1004 548)" fill="none" stroke="url(#grad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#iconGlow)"><rect x="4" y="4" width="104" height="68" rx="6"/><path d="M20 44H35L43 28L51 52L62 34L72 42L81 33L92 43"/><path d="M51 72V82M38 82H64"/></g><rect class="glow g3" x="980" y="621" width="130" height="2" rx="1" fill="url(#grad)"/></g><line x1="56" y1="658" x2="1144" y2="658" stroke="#E2E8F0" stroke-width="1"/><g class="row r4"><text x="70" y="710" class="num">04</text><line x1="154" y1="656" x2="154" y2="732" stroke="url(#grad)" stroke-width="1.5" opacity=".7"/><text x="192" y="680" class="title">Engineering</text><text x="192" y="707" class="body">Writing clean, maintainable code and automation that connects infrastructure,</text><text x="192" y="728" class="body">tools, and applications to solve real problems.</text><text x="192" y="756" class="stack">PYTHON · POWERSHELL · TYPESCRIPT · NODE.JS</text><g class="icon i4" transform="translate(1004 676)" fill="none" stroke="url(#grad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#iconGlow)"><rect x="4" y="4" width="104" height="68" rx="6"/><circle cx="17" cy="17" r="2" fill="#2563EB" stroke="none"/><circle cx="25" cy="17" r="2" fill="#6366F1" stroke="none"/><circle cx="33" cy="17" r="2" fill="#A855F7" stroke="none"/><path d="M36 39L25 49L36 59M76 39L87 49L76 59M61 35L51 63"/></g><rect class="glow g4" x="980" y="749" width="130" height="2" rx="1" fill="url(#grad)"/></g></svg>