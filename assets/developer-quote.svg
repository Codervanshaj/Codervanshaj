<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Developer Quote</title>
<desc id="desc">The function of good software is to make the complex appear to be simple. — Grady Booch</desc>
<rect width="1200" height="330" fill="#ffffff"/>
<text x="42" y="48" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" letter-spacing="3" fill="#57606a">DEVELOPER QUOTE</text>
<line x1="42" y1="70" x2="1158" y2="70" stroke="#d0d7de" stroke-width="2"/>
<rect x="108" y="102" width="984" height="178" rx="14" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1"/>
<text x="140" y="160" font-family="Georgia,'Times New Roman',serif" font-size="30" font-style="italic" fill="#0969da">“</text>
<text x="168" y="163" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="27" font-style="italic" font-weight="500" fill="#24292f">The function of good software is to make the complex</text>
<text x="168" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="27" font-style="italic" font-weight="500" fill="#24292f">appear to be simple.</text>
<text x="1050" y="251" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" fill="#0969da">GRADY BOOCH</text>
</svg>